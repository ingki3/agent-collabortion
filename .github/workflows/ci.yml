name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: colab
          POSTGRES_PASSWORD: colab
          POSTGRES_DB: colab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # server/internal/db integration test (migrate → tables → idempotent)
      COLAB_TEST_DB_URL: postgres://colab:colab@localhost:5432/colab?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: vet
        run: for m in contracts server daemon cli; do (cd $m && go vet ./...) || exit 1; done
      - name: test
        run: for m in contracts server daemon cli; do (cd $m && go test ./...) || exit 1; done
      - name: build
        run: make build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
