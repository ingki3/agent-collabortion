        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/settings:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [settings]
      operationId: getWorkspaceSettings
      summary: 워크스페이스 설정(S14 런타임 정책 · 예산 · 루프 상한 · 컨텍스트 · Workdir · 보안)
      description: |
        권한: 워크스페이스 멤버(읽기). 변경은 `PATCH`.
      x-screen: [S14]
      x-phase: P2
      responses:
        '200':
          description: 설정 전체.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [settings]
      operationId: updateWorkspaceSettings
      summary: 워크스페이스 설정 변경
      description: |
        권한: owner · admin. **`task_event_masking`(보안 탭)은 owner만**(SCREEN §4.10).
        부분 갱신. 루프 상한(`loop_limits`)은 다음 트리거부터, `runtime_offline_grace`·`workdir_retention_days`는 다음 스윕부터 적용된다.
      x-prd: [FR-3.5, FR-4.4, FR-6.4, FR-7.3, FR-9, FR-9.2, §9 보안]
      x-screen: [S14]
      x-phase: P2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceSettingsUpdate' }
      responses:
        '200':
          description: 변경됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── runtimes ─────────────────────────────
  /workspaces/{workspaceId}/runtimes:
    parameters:
