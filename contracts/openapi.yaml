  # ───────────────────────────── messages ─────────────────────────────
  /sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [messages]
      operationId: listMessages
      summary: 타임라인 · 스레드 조회
      description: |
        권한: 워크스페이스 멤버 · `TaskToken`(그 task의 세션만).
        시간순으로 돌려준다. `thread`를 주면 그 루트와 답글만(`colab session messages --thread <id> --limit 30` = `thread`+`limit=30`). 기본은 최상위 메시지만(`include_replies=false`), 각 항목에 `reply_count`. `after`는 재연결 백필용.
      x-colab-cli: session messages
      x-prd: [FR-3.1, FR-4.1]
      x-screen: [S7]
      x-phase: P1
      security:
        - UserSession: []
        - TaskToken: []
      parameters:
        - name: thread
          in: query
          description: 스레드 루트 메시지 id.
          schema: { type: string, format: uuid }
        - name: include_replies
          in: query
          schema: { type: boolean, default: false }
        - name: kind
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/MessageKind' }
        - name: before
          in: query
          description: 이 커서보다 오래된 것(뒤로 스크롤).
          schema: { type: string }
        - name: after
          in: query
          description: 이 커서보다 새로운 것(백필).
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 메시지(시간순).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [messages]
      operationId: postMessage
      summary: 메시지 게시(멱등) — 라우팅 규칙 1~8 적용
      description: |
        권한: 워크스페이스 멤버(누구나 게시·멘션, FR-5.3) · `TaskToken`(에이전트, 그 task의 세션만).
        **`Idempotency-Key` 필수.** 사용자는 랜덤 UUID를, CLI는 `UUIDv5(task:<task_id>:<seq>)`(attempt 제외, seq는 `CliContext.last_seq`에서 이어짐 — colab-cli.md §1)를 쓴다(§9 내구성) — 폐기된 토큰은 `401`(E11-04). 서버가 FR-3.3 규칙 1~8과 lane 해소 4규칙을 적용해 task를 만들거나 병합한다(FR-3.4: **어떤 메시지도 진행 중 턴을 취소하지 않는다**). `new_lane: true`는 해소 규칙 3을 건너뛴다(t-2, 사람만). `suppress_agent_ids`는 이번 메시지에서만 트리거를 억제한다(FR-3.6). 비참여 에이전트 멘션은 게시하되 `warnings[]`로 알린다(E1-04). 응답 `triggers[]`는 실제로 만들어진/병합된 task.
        `TaskToken`으로 게시할 때 `author_type`은 `agent`, `source_task_id`는 그 task다. 루프 상한 초과면 메시지는 게시되고 세션이 `paused(loop)`가 되며 task는 만들지 않는다(E4-01).
      x-colab-cli: message post
      x-prd: [FR-3.1, FR-3.2, FR-3.3, FR-3.4, FR-3.5, FR-3.6]
      x-screen: [S7]
      x-phase: P1
      security:
        - UserSession: []
        - TaskToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/ClientSeq'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: "게시됨(재요청이면 같은 본문 + `Idempotent-Replayed: true`)."
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePostResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /sessions/{sessionId}/messages/preview:
