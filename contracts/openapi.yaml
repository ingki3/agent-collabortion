    get:
      tags: [runtimes]
      operationId: listRuntimes
      summary: 런타임(머신) 목록(S11)
      description: |
        권한: 워크스페이스 멤버.
        카드 정보 전부 — 온라인 상태, 데몬 버전, probe 결과(`capabilities`: CLI 종류·버전·모델·로그인, `repos`: 경로·remote URL·브랜치·클린), 실행 중 task 수, workdir 사용량 합계, 오프라인 경과와 유예 잔여(FR-9.2).
      x-prd: [FR-9, FR-9.2]
      x-screen: [S11, S6]
      x-phase: P1
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RuntimeStatus' }
      responses:
        '200':
          description: 목록.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Runtime' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/runtimes/pairings:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [runtimes]
      operationId: createPairing
      summary: Add a computer — 설치 명령 + 페어링 토큰 발급(S12)
      description: |
        권한: owner · admin(런타임 추가).
        설치 명령 2줄과 1회용 페어링 토큰을 만든다. 토큰 교환(데몬 → 서버)은 `daemon-protocol.md`. 이후 연결 단계는 `GET …/pairings/{pairingId}` 또는 SSE `pairing.updated`로 본다. 기본 만료 30분.
      x-prd: [FR-9]
      x-screen: [S12, S4]
      x-phase: P1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: 연결될 런타임 이름 제안. 데몬이 호스트명으로 덮어쓸 수 있다. }
      responses:
        '201':
          description: 발급됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pairing' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/runtimes/pairings/{pairingId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: pairingId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [runtimes]
      operationId: getPairing
      summary: 페어링 진행 단계(S12 연결 대기)
      description: |
        권한: 워크스페이스 멤버.
        `waiting → connected → probing → ready` 4단계. 3분 넘게 `waiting`이면 화면이 문제 해결 안내를 편다(SCREEN §4.8).
      x-screen: [S12]
      x-phase: P1
      responses:
        '200':
          description: 상태.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pairing' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        default: { $ref: '#/components/responses/Problem' }

  /runtimes/{runtimeId}:
    parameters:
      - $ref: '#/components/parameters/RuntimeId'
    get:
      tags: [runtimes]
      operationId: getRuntime
      summary: 런타임 상세
      description: |
        권한: 워크스페이스 멤버.
        목록 항목과 같은 스키마에 `active_sessions`(이 머신에 묶인 활성 세션 요약)를 더한다 — 삭제 차단 사유 표시용(FR-9.2).
      x-screen: [S11]
      x-phase: P1
      responses:
        '200':
          description: 상세.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [runtimes]
      operationId: updateRuntime
      summary: 런타임 이름 · 런타임별 동시 task 상한
      description: |
        권한: owner · admin.
      x-prd: [FR-9]
      x-screen: [S11, S14]
      x-phase: P5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                max_concurrent_tasks:
                  type: [integer, 'null']
                  minimum: 1
                  description: 이 머신의 상한. null이면 워크스페이스 `runtime_policy.max_concurrent_tasks`(기본 10).
      responses:
        '200':
          description: 변경됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runtime' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [runtimes]
      operationId: deleteRuntime
      summary: 런타임 삭제
      description: |
        권한: owner · admin.
        **활성 세션이 걸려 있으면 `409`**(`code: runtime_has_active_sessions`, `Problem.sessions[]`에 대상 세션). 먼저 재바인딩 또는 종료를 요구한다(FR-9.2, E14-08). 삭제되면 데몬의 페어링이 무효가 된다.
      x-prd: [FR-9.2]
      x-screen: [S11]
      x-phase: P4
      responses:
        '204': { description: 삭제됨. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }

  /runtimes/{runtimeId}/repo-checks:
    parameters:
      - $ref: '#/components/parameters/RuntimeId'
    post:
      tags: [runtimes]
      operationId: checkRepo
      summary: 저장소 검증(S6 마법사 · worktree 격리)
      description: |
        권한: 워크스페이스 멤버.
        선택한 런타임의 데몬에게 `repo_path` 존재 · git 상태(클린 여부 · 기본 브랜치 · remote URL)를 물어 돌려준다(FR-2.1). 실패하면 폼이 다음 단계를 막는다(E13-01). 데몬이 오프라인이면 `409 runtime_offline`, 데몬 응답 지연은 `504`.
      x-prd: [FR-2.1, FR-9]
      x-screen: [S6]
      x-phase: P4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo_path]
              properties:
                repo_path: { type: string, description: 그 머신의 절대 경로. }
      responses:
        '200':
          description: "검증 결과(`ok: false`여도 200 — 폼이 사유를 보여준다)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoCheck' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        default: { $ref: '#/components/responses/Problem' }

  /runtimes/{runtimeId}/workdirs:
    parameters:
      - $ref: '#/components/parameters/RuntimeId'
    get:
      tags: [runtimes]
      operationId: listRuntimeWorkdirs
      summary: workdir 목록(S13)
      description: |
        권한: 워크스페이스 멤버.
        종류 · 소유(에이전트 또는 lane) · 경로·브랜치 · 용량 · 마지막 사용 · 보존 만료 · 상태. 상단 사용률은 `quota`로 계산한다(FR-6.4).
      x-prd: [FR-6.4]
      x-screen: [S13]
      x-phase: P4
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WorkdirStatus' }
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 목록.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Workdir' }
                      disk_bytes_total: { type: integer, format: int64 }
                      disk_quota_gb: { type: [integer, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /workdirs/{workdirId}:
    parameters:
      - name: workdirId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [runtimes]
      operationId: deleteWorkdir
      summary: workdir 수동 삭제
      description: |
        권한: owner · admin, 또는 그 workdir 세션의 Director.
        **미병합 커밋이나 미커밋 변경이 있으면 기본 차단**(`409 workdir_dirty`, `Problem.detail`에 사유). `force=true`로 확인 후 삭제한다. worktree는 워크트리만 지우고 브랜치는 남긴다(FR-6.4 M4). 실제 삭제는 데몬이 수행하므로 `202`이고 결과는 SSE `workdir.updated`.
      x-prd: [FR-6.4]
      x-screen: [S13]
      x-phase: P4
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        '202':
          description: 삭제 요청 접수.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workdir' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── agents ─────────────────────────────
  /workspaces/{workspaceId}/agents:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [agents]
      operationId: listAgents
      summary: 에이전트 목록(S9 · S6 참여자 선택)
      description: |
        권한: 워크스페이스 멤버.
        `status`는 FR-1.3 파생값(워크스페이스 전체 task 기준). `invitable`은 **호출자**가 이 에이전트를 세션에 초대할 수 있는지(`respond_to` 판정, FR-1.9) — S6 5단계에서 비활성+사유 표시에 쓴다.
      x-prd: [FR-1.3, FR-1.9]
      x-screen: [S9, S6, S7]
      x-phase: P1
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/AgentRole' }
        - name: runtime_kind
          in: query
          description: 기본 프로파일의 런타임 종류.
          schema: { $ref: '#/components/schemas/RuntimeKind' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AgentStatus' }
        - name: owner_id
          in: query
          schema: { type: string, format: uuid }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 페이지.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Agent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [agents]
      operationId: createAgent
      summary: 에이전트 생성(S10 · FR-1.1)
      description: |
        권한: 워크스페이스 멤버(생성자가 `owner_id`). **사람만** — 에이전트 툴셋에는 이 operation이 없다(FR-1.5).
        `profiles`는 1개 이상, 정확히 하나가 `is_default`. `name`은 워크스페이스 내 유일(`409`).
      x-prd: [FR-1.1, FR-1.5, FR-1.6]
      x-screen: [S10]
      x-phase: P1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreate' }
      responses:
        '201':
          description: 생성됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/agent-templates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [agents]
      operationId: listAgentTemplates
      summary: 팀 템플릿 3종(FR-1.4)
      description: |
        권한: 워크스페이스 멤버.
        리서치 팀 · 개발 팀 · 콘텐츠 팀. 각 템플릿의 에이전트마다 이 워크스페이스의 온라인 런타임 능력으로 계산한 **프로파일 자동 매핑 결과**(`mapped` 또는 `unmapped`+사유)를 함께 준다.
      x-prd: [FR-1.4]
      x-screen: [S9, S4]
      x-phase: P2
      responses:
        '200':
          description: 템플릿 목록.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/agent-templates/{templateKey}/apply:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: templateKey
        in: path
        required: true
        schema: { $ref: '#/components/schemas/AgentTemplateKey' }
    post:
      tags: [agents]
      operationId: applyAgentTemplate
      summary: 템플릿으로 에이전트 일괄 생성
      description: |
        권한: 워크스페이스 멤버(생성자가 `owner_id`).
        템플릿의 역할·instruction으로 에이전트를 만들고 프로파일은 감지된 런타임에 맞춰 자동 매핑한다. 매핑 불가 에이전트도 등록하되 `definition_source`에 템플릿 키, 응답의 `unmapped[]`에 사유를 넣는다(FR-1.7 검증 규칙 준용). 이름 충돌은 `name_overrides`로 피한다. P2 DoD "3분 이내"의 대상.
      x-prd: [FR-1.4, FR-1.8]
      x-screen: [S9, S4]
      x-phase: P2
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                runtime_id:
                  type: [string, 'null']
                  format: uuid
                  description: 프로파일 매핑 기준 런타임. 비우면 온라인 런타임 전체의 능력 합집합.
                name_overrides:
                  type: object
                  additionalProperties: { type: string }
                  description: 템플릿 에이전트 키 → 이름.
      responses:
        '201':
          description: 생성 결과.
          content:
            application/json:
              schema:
                type: object
                required: [agents, unmapped]
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }
                  unmapped:
                    type: array
                    items:
                      type: object
                      required: [agent_id, reason]
                      properties:
                        agent_id: { type: string, format: uuid }
                        reason: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      summary: 에이전트 상세(프로파일 포함)
      description: |
