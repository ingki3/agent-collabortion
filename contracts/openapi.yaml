        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── lanes ─────────────────────────────
  /sessions/{sessionId}/lanes:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [lanes]
      operationId: listLanes
      summary: lane 보드(S7 좌열)
      description: |
        권한: 워크스페이스 멤버 · `TaskToken`.
        상태별 카드 데이터 — 담당 에이전트, 위임 요약(`brief`), 경과, `reentry_count`, workdir 참조, 현재 task 한 줄(`current_task`), `blocked` 질문 요약, `paused` 초과 금액, `failed` 분류, 그리고 호출자가 쓸 수 있는 동작(`actions`: director·deputy만 restart/cancel).
      x-prd: [FR-6.2, FR-3.4]
      x-screen: [S7]
      x-phase: P2
      security:
        - UserSession: []
        - TaskToken: []
      parameters:
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/LaneStatus' }
      responses:
        '200':
          description: lane 목록.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Lane' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [lanes]
      operationId: delegateLane
      summary: 위임 — 새 lane + 멘션 메시지 자동 작성(`colab lane delegate`)
      description: |
        권한: `TaskToken`(에이전트만 — 사람은 `postMessage`의 `new_lane`을 쓴다).
        해소 규칙 2 — **항상 새 lane**(E2-02·03). `delegated_from_task_id` = 호출 task(합류 그룹 키, FR-6.5). 대상은 세션 참여자로 제한 — 아니면 `422 not_participant`와 안내("`hitl ask`로 Director에게 참여자 추가 요청", E15-02). `depends_on`은 같은 세션의 lane ids(DAG, 의존 lane이 끝나면 자동 시작). 서버가 `[@대상](mention://agent/<id>)` + brief 메시지를 호출 에이전트 이름으로 게시한다. 세션이 `paused`면 lane은 만들되 task는 dispatch되지 않는다.
      x-colab-cli: lane delegate
