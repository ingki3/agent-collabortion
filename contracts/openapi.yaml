openapi: 3.1.0
info:
  title: Colab Server API
  version: 0.1.1-draft
  summary: Colab 서버 REST API — P1~P3(수직 슬라이스 · 협업 코어 · HITL/재개/예산)에서 웹(W)과 colab CLI(C)가 호출하는 전부.
  description: |
    # 읽는 법

    - **SSOT**: 리소스·필드·ENUM 값은 `server/migrations/0001_init.sql`(스키마 v0)과 정확히 일치한다. 동작은 `PRD.md` FR-1~FR-9, 화면이 부르는 순서는 `SCREEN.md` §4.
    - **권한**은 각 operation `description`의 **첫 줄**에 `권한:`으로 적는다. 원칙(PRD §9): 판정은 항상 체인 최상단의 **사람 originator** 기준이며 에이전트 경유로 권한이 상승하지 않는다. 세션 내 사람 역할은 Director · deputy · 워크스페이스 멤버 셋뿐이다(FR-5.3).
    - **데몬 엔드포인트**(claim · heartbeat · event push · 토큰 폐기 통보 · 페어링 토큰 교환)는 이 문서에 없다 — `contracts/daemon-protocol.md`.
    - **colab CLI가 쓰는 operation**은 `x-colab-cli: <명령>` 확장으로 표시하고 보안 스킴 `TaskToken`(`COLAB_TASK_TOKEN`, task 범위·단기)을 쓴다. 토큰이 재큐잉으로 폐기되면 `401`이다(FR-9.1).
    - **오류**는 전부 RFC 9457 `application/problem+json`(`Problem`). 검증 실패는 `422`, 상태 전이 불가·중복·차단은 `409`, 권한 없음은 `403`(버튼은 보이되 비활성 — 사유는 `detail`).
    - **페이지네이션**은 커서 방식(`cursor` · `limit` → `next_cursor`). 메시지 타임라인만 `before`/`after` 양방향.
    - **멱등키** `Idempotency-Key`(UUID)는 메시지 게시(`POST /sessions/{id}/messages`, `POST /lanes/{id}/restart`)와 HITL 응답(`POST /hitl-requests/{id}/response`)에 **필수**, 그 밖의 생성 POST에서 선택. 같은 키의 재요청은 첫 응답을 그대로 돌려준다(`Idempotent-Replayed: true`).
    - **실시간**은 SSE 하나(`GET /workspaces/{workspaceId}/stream`). 이벤트 종류는 `StreamEvent.type`에 전부 나열한다.
    - `x-prd`: 그 operation이 구현하는 PRD 항목. `x-screen`: 부르는 화면. `x-phase`: 처음 필요한 단계(P1~P5).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: Colab S 스트림 (contracts/openapi.md 참고)

servers:
  - url: /api/v1
    description: 같은 오리진의 API 루트. 웹은 상대 경로로, colab CLI는 데몬이 넘긴 서버 URL 뒤에 붙인다.

security:
  - UserSession: []

tags:
  - name: auth
    description: S1 로그인 · S2 회원가입 · S3 초대 수락. 사용자 세션(쿠키)을 발급한다.
  - name: workspaces
    description: 워크스페이스 · 멤버 · 초대 · S4 온보딩 상태.
  - name: settings
    description: S14 설정 8탭(멤버 탭은 `workspaces`). 기본값은 PRD §7 `workspace_settings`.
  - name: runtimes
    description: S11 Runtimes · S12 Add a computer(페어링) · probe 결과(CLI · 모델 · 저장소) · S13 workdir.
  - name: agents
    description: S9 Agents · S10 편집(프로파일 · 킬 스위치) · 팀 템플릿(FR-1.4) · 테스트 채팅(FR-1.8.1).
  - name: sessions
    description: S5 목록 · S6 마법사(검증 · 후보) · S7 상단 액션(상태 전이 · Director · 참여자) · S17 재바인딩.
  - name: messages
    description: 타임라인 · 스레드 · 게시(멱등) · 트리거 미리보기(FR-3.6).
  - name: lanes
    description: lane 보드(FR-6.2) · 위임(FR-6.2) · "중단하고 다시 지시" / "중단"(FR-3.4) · task 이력.
  - name: tasks
    description: task 조회 · 활동 피드(`task_event`, FR-7.2) · `colab status set`.
  - name: hitl
    description: HITL 요청(FR-5.1) · 응답(멱등, deputy 규칙 FR-5.4) · 예산 상향(`task.budget_override`, FR-7.3).
  - name: inbox
    description: S8 인박스 — 7타입 · 심각도 3종 · 정렬 규칙(FR-8).
  - name: artifacts
    description: 아티팩트(FR-4.3, 버전) · 리뷰 승인/반려(`agent_approval`, FR-2.2) · 결정 기록(FR-4.2).
  - name: cost
    description: 비용 집계 — task · agent · 세션 · 런타임 4단위, 추정치 배지(FR-7.3).
  - name: realtime
    description: SSE 스트림 하나. 재연결 시 `Last-Event-ID`로 놓친 이벤트를 채운다(SCREEN §6).
  - name: cli
    description: colab CLI 전용 보조 operation(`TaskToken` → 자기 task · lane · 세션 해석).

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 회원가입(S2)
      description: |
        권한: 없음(공개).
        이름·이메일·비밀번호로 계정을 만들고 사용자 세션 쿠키를 발급한다. `invite_token`을 주면 가입 직후 그 초대를 자동 수락한다(S3 미로그인 흐름). 워크스페이스가 없으면 클라이언트는 S4 온보딩으로 보낸다(SCREEN §2.1).
      security: []
      x-prd: [S2, S3]
      x-screen: [S2]
      x-phase: P1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, email, password]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                invite_token: { type: string, description: S3 초대 토큰. 있으면 가입 직후 자동 수락. }
      responses:
        '201':
          description: 가입됨. `Set-Cookie`로 사용자 세션 발급.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 로그인(S1)
      description: |
        권한: 없음(공개).
        이메일/비밀번호 로그인. 실패 사유는 `Problem.code`로 구분한다 — `account_not_found` · `password_mismatch` · `account_locked`(S1). SSO는 미결(openapi.md).
      security: []
      x-prd: [S1]
      x-screen: [S1]
      x-phase: P1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                invite_token: { type: string, description: S3 초대 토큰. 있으면 로그인 직후 자동 수락. }
      responses:
        '200':
          description: 로그인됨.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 로그아웃
      description: |
        권한: 로그인한 사용자.
        사용자 세션을 폐기한다.
      x-phase: P1
      responses:
        '204': { description: 폐기됨. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 현재 사용자와 소속 워크스페이스
      description: |
        권한: 로그인한 사용자.
        앱 셸 진입 시 한 번 호출한다. 워크스페이스가 비어 있으면 S4로, 초대 대기가 있으면 목록으로 안내한다(SCREEN §2.1).
      x-screen: [App Nav, S4]
      x-phase: P1
      responses:
        '200':
          description: 현재 사용자.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /me/notification-settings:
    get:
      tags: [settings]
      operationId: getNotificationSettings
      summary: 알림 설정 조회(S14 알림 탭 — 개인)
      description: |
        권한: 로그인한 사용자(본인).
      x-screen: [S14]
      x-phase: P5
      responses:
        '200':
          description: 알림 설정.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [settings]
      operationId: updateNotificationSettings
      summary: 알림 설정 변경
      description: |
        권한: 로그인한 사용자(본인).
        이메일·푸시 여부와 세션 구독 기본값(전부 / HITL만 / 종료만, FR-8).
      x-screen: [S14]
      x-phase: P5
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: 변경됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /invites/{inviteToken}:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    get:
      tags: [auth]
      operationId: previewInvite
      summary: 초대 미리보기(S3)
      description: |
        권한: 없음(공개 — 토큰이 곧 권한).
        워크스페이스·초대자·부여될 역할을 보여준다. 만료·취소된 토큰은 `410`이고 `Problem.code`가 `invite_expired` / `invite_revoked`다.
      security: []
      x-screen: [S3]
      x-phase: P1
      responses:
        '200':
          description: 초대 정보.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        default: { $ref: '#/components/responses/Problem' }

  /invites/{inviteToken}/accept:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    post:
      tags: [auth]
      operationId: acceptInvite
      summary: 초대 수락(S3)
      description: |
        권한: 로그인한 사용자.
        초대의 워크스페이스에 `member`로 가입한다. 이미 멤버면 `200`으로 기존 멤버십을 돌려준다(멱등).
      x-prd: [P1 DoD 초대 링크]
      x-screen: [S3]
      x-phase: P1
      responses:
        '200':
          description: 이미 멤버였거나 지금 가입됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── workspaces ─────────────────────────────
  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: 내 워크스페이스 목록
      description: |
        권한: 로그인한 사용자(본인이 멤버인 것만).
      x-phase: P1
      responses:
        '200':
          description: 목록.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: 워크스페이스 생성(S4 1단계)
      description: |
        권한: 로그인한 사용자. 생성자가 `owner`.
        `workspace_settings` 행이 PRD §7 기본값으로 함께 만들어진다.
      x-screen: [S4]
      x-phase: P1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                slug:
                  type: string
                  pattern: '^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$'
                  description: 생략하면 이름에서 만든다.
      responses:
        '201':
          description: 생성됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: 워크스페이스 조회
      description: |
        권한: 워크스페이스 멤버.
      x-phase: P1
      responses:
        '200':
          description: 워크스페이스.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: 워크스페이스 이름 변경
      description: |
        권한: owner · admin.
      x-phase: P5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: 변경됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/onboarding:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: getOnboardingStatus
      summary: S4 온보딩 체크리스트 상태
      description: |
        권한: 워크스페이스 멤버.
        세 단계(워크스페이스 · 컴퓨터 연결 · 에이전트)의 완료 판정. 건너뛴 단계는 홈 체크리스트로 남는다(SCREEN §4.2).
      x-screen: [S4]
      x-phase: P5
      responses:
        '200':
          description: 상태.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: listMembers
      summary: 멤버 목록(S14 멤버 탭 · Director 선택 · 멘션 자동완성)
      description: |
        권한: 워크스페이스 멤버.
      x-screen: [S14, S6, S7]
      x-phase: P1
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 멤버 페이지.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [workspaces]
      operationId: updateMemberRole
      summary: 멤버 역할 변경
      description: |
        권한: owner · admin. **owner 강등은 owner만**(SCREEN §2.3). 마지막 owner는 강등할 수 없다(`409`).
      x-screen: [S14]
      x-phase: P5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/MemberRole' }
      responses:
        '200':
          description: 변경됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [workspaces]
      operationId: removeMember
      summary: 멤버 제거
      description: |
        권한: owner · admin. 마지막 owner는 제거할 수 없다(`409`). 그 멤버가 Director인 활성 세션이 있으면 `409`(먼저 Director를 교체).
      x-screen: [S14]
      x-phase: P5
      responses:
        '204': { description: 제거됨. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/invites:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: listInvites
      summary: 초대 목록(대기 · 만료)
      description: |
        권한: owner · admin.
      x-screen: [S14]
      x-phase: P1
      responses:
        '200':
          description: 초대 목록.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [workspaces]
      operationId: createInvite
      summary: 초대 링크 생성
      description: |
        권한: owner · admin.
        이메일을 주면 그 주소로만 수락할 수 있고 알림 메일을 보낸다. 비우면 링크를 아는 누구나 수락한다. 기본 만료 7일.
      x-prd: [P1 DoD 초대 링크]
      x-screen: [S14, S4]
      x-phase: P1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, 'null'], format: email }
                role:
                  allOf: [{ $ref: '#/components/schemas/MemberRole' }]
                  default: member
                  description: owner는 초대로 줄 수 없다(`422`).
                expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
      responses:
        '201':
          description: 생성됨. `url`을 복사해 전달한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
