    parameters:
      - $ref: '#/components/parameters/HitlRequestId'
    post:
      tags: [hitl]
      operationId: respondHitlRequest
      summary: HITL 응답(멱등) — 답변 · 승인/거절 · 예산 상향
      description: |
        권한: `approver_spec`에 따라 — `director`는 **Director, 그리고 기한 절반 경과 후 deputy**(M7, E7-09·10); `any_member`는 워크스페이스 멤버; uuid는 그 사용자. 그 외 `403`(카드는 보이되 버튼 비활성, `Problem.can_respond_from`에 deputy 가능 시각).
        **`Idempotency-Key` 필수.** 서버는 (a) `open`이고 (b) 응답자가 spec에 맞는지 검증한다. `overdue`여도 답할 수 있다(E7-15). **같은 요청에 대한 두 번째 응답은 오류가 아니라 무시** — `200`에 기존 응답 + `ignored: true`(E7-08).
        효과: `answered` + 결정 기록 1건 + task `queued`로 재큐잉(새 attempt, resume 우선). `approval` 거절도 정상 흐름 — `approved: false`와 사유가 재개 프롬프트에 들어간다(E7-17). 예산 초과 시스템 HITL(`task_id` 있음)에 `budget_override_usd`를 주면 `task.budget_override`에 저장되고 에이전트 `budget_per_task`는 불변(E9-02). 종료 조건 `user_approval` HITL 승인은 세션을 `completing`으로 보낸다(E6-03); 거절은 `active` 유지 + 사유 결정 기록(E6-04). 킬 스위치로 `disabled`된 에이전트의 task는 `answered`로 기록만 하고 재큐잉을 보류한다(E10-08).
      x-prd: [FR-5.2, FR-5.4, FR-7.3, FR-2.2]
      x-screen: [S7, S8]
      x-phase: P2   # 플랫폼 발행 `approval`(종료 조건 `user_approval`)의 승인·거절만 P2(E6-03·E6-04); 에이전트 발행 HITL 응답·재큐잉·예산 상향·deputy 는 P3 — G5 S-25, PR #101
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HitlResponse' }
      responses:
        '200':
          description: "기록됨(또는 이미 답변됨 — `ignored: true`)."
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema:
                type: object
                required: [hitl_request, ignored]
                properties:
                  hitl_request: { $ref: '#/components/schemas/HitlRequest' }
                  ignored: { type: boolean, description: 이미 답변된 요청이라 이 응답을 무시했다. }
                  decision_id: { type: [string, 'null'], format: uuid }
                  task: { $ref: '#/components/schemas/Task' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── inbox ─────────────────────────────
  /inbox:
    get:
      tags: [inbox]
      operationId: listInbox
      summary: 인박스(S8)
      description: |
        권한: 로그인한 사용자(본인 멤버십의 항목만).
        정의는 "나에게 열려 있는 HITL 요청 + 기한 임박 항목"의 합집합(FR-5.4). **정렬**: `overdue` → `action_required` → `attention` → `info`, 묶음 안에서 기한 임박 순(SCREEN §4.6). `hitl_request`는 처음엔 Director에게만, 기한 절반 후 deputy에게도 나타나며 `delegated: true`(O5). 각 항목은 타입별 카드 데이터(`ref`)와 인라인 동작 목록(`actions`)을 가진다.
      x-prd: [FR-8, FR-5.4, FR-6.2.1]
      x-screen: [S8]
      x-phase: P2
      parameters:
        - name: workspace_id
          in: query
          description: 비우면 모든 워크스페이스.
          schema: { type: string, format: uuid }
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, unread, action_required]
            default: all
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/InboxItemType' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 페이지(정렬 규칙 적용).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/InboxItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /inbox/summary:
    get:
      tags: [inbox]
      operationId: getInboxSummary
      summary: 내비 뱃지 — action_required 개수만
      description: |
        권한: 로그인한 사용자.
        `info`까지 세면 뱃지가 무의미하다(SCREEN §4.6).
      x-screen: [App Nav]
      x-phase: P2
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 개수.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /inbox/{inboxItemId}/read:
    parameters:
      - name: inboxItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [inbox]
      operationId: markInboxRead
      summary: 읽음 처리
      description: |
        권한: 항목 소유 멤버.
        멱등. `action_required` 항목은 읽어도 해소되지 않는다 — 해소는 응답/답글이 한다.
      x-screen: [S8]
      x-phase: P2
      responses:
        '200':
          description: 읽음.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /inbox/read-all:
    post:
      tags: [inbox]
      operationId: markAllInboxRead
      summary: 전부 읽음(info · attention만)
      description: |
        권한: 로그인한 사용자.
        `action_required`는 건드리지 않는다.
      x-screen: [S8]
      x-phase: P2
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 처리 수.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── artifacts · decisions ─────────────────────────────
  /sessions/{sessionId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [artifacts]
      operationId: listArtifacts
      summary: 아티팩트 목록(버전 포함, 제출 순)
      description: |
        권한: 워크스페이스 멤버 · `TaskToken`.
        제출 순서 = 재바인딩 시 재적용 순서(E14-06).
      x-prd: [FR-4.3]
      x-screen: [S7]
      x-phase: P2
      security:
        - UserSession: []
        - TaskToken: []
      parameters:
        - name: latest_only
          in: query
          description: 이름별 최신 버전만.
          schema: { type: boolean, default: false }
        - name: type
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 목록.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artifact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [artifacts]
      operationId: submitArtifact
      summary: 아티팩트 제출(`colab artifact submit --name --type --file`)
      description: |
        권한: `TaskToken`(에이전트) · 워크스페이스 멤버(사람이 자료를 올릴 때).
        같은 이름 재제출은 `version`+1(FR-4.3). `type`은 열린 집합(`file` · `diff` · `branch` · `doc` …). 종료 조건 `artifact_submitted`가 충족되면 서버가 나머지 조건을 보고 `user_approval` 시스템 HITL을 발행한다(E6-01) — 응답 `completion_progress`로 알 수 있다. 지정 에이전트가 아니면 저장은 되지만 조건은 미충족(E6-02). 크기 상한 50 MB(`413`).
      x-colab-cli: artifact submit
      x-prd: [FR-4.3, FR-2.2, FR-6.1]
      x-screen: [S7]
      x-phase: P2
      security:
        - TaskToken: []
        - UserSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, type, file]
              properties:
                name: { type: string, minLength: 1 }
                type: { type: string, minLength: 1, examples: [file, diff, branch, doc] }
                file: { type: string, contentEncoding: binary }
                description: { type: string }
            encoding:
              file:
                contentType: application/octet-stream, text/plain, application/json
      responses:
        '201':
          description: 제출됨.
          content:
            application/json:
              schema:
                type: object
                required: [artifact]
                properties:
                  artifact: { $ref: '#/components/schemas/Artifact' }
                  completion_progress: { $ref: '#/components/schemas/CompletionProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: getArtifact
      summary: 아티팩트 메타(`colab artifact get`)
      description: |
        권한: 워크스페이스 멤버 · `TaskToken`(같은 세션). 크로스 lane 읽기는 아티팩트로만 한다(FR-6.1) — 워크트리 경로는 노출하지 않는다.
      x-colab-cli: artifact get
      x-prd: [FR-4.3, FR-6.1]
      x-screen: [S7]
      x-phase: P2
      security:
        - UserSession: []
        - TaskToken: []
      responses:
        '200':
          description: 메타.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /artifacts/{artifactId}/content:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: downloadArtifact
      summary: 아티팩트 본문 다운로드
      description: |
        권한: 워크스페이스 멤버 · `TaskToken`(같은 세션).
      x-colab-cli: artifact get
      x-prd: [FR-4.3]
      x-phase: P2
      security:
        - UserSession: []
        - TaskToken: []
      responses:
        '200':
          description: "본문. `Content-Disposition: attachment`."
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /artifacts/{artifactId}/review:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts]
      operationId: reviewArtifact
      summary: 리뷰 승인/반려(`colab review approve|reject`)
      description: |
        권한: `TaskToken`(에이전트). 종료 조건 `agent_approval`에 지정된 에이전트가 아니면 `403 not_designated_reviewer`(E6-06) — 저장하지 않는다.
        `approve`는 조건 충족 → 나머지 조건에 따라 `completing`(단독이면 사람 게이트 없이 종료, E6-05) 또는 `user_approval` HITL 발행. `reject`는 `comments`를 그 아티팩트를 제출한 task의 lane 스레드에 답글로 게시한다(해소 규칙 1로 재진입 — E16-B 5단계). 결정 기록에 `source: agent`로 남는다.
      x-colab-cli: review approve | review reject
      x-prd: [FR-2.2, FR-7.4, FR-6.1]
      x-phase: P2
      security:
        - TaskToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
                  enum: [approve, reject]
                comments: { type: string, description: reject면 필수. }
      responses:
        '200':
          description: 기록됨.
          content:
            application/json:
              schema:
                type: object
                required: [review, completion_progress]
                properties:
                  review: { $ref: '#/components/schemas/ArtifactReview' }
                  completion_progress: { $ref: '#/components/schemas/CompletionProgress' }
                  message: { $ref: '#/components/schemas/Message', description: reject일 때 게시된 답글. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /sessions/{sessionId}/decisions:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [artifacts]
      operationId: listDecisions
      summary: 결정 기록(FR-4.2)
      description: |
        권한: 워크스페이스 멤버 · `TaskToken`.
        시간순. 조회 **실패**와 "확실히 비어 있음"을 구분해야 하므로 빈 목록은 `200 []`, 장애는 `5xx`(FR-4.2) — 데몬이 브리프를 만들 때 이 구분에 기댄다.
      x-colab-cli: session get
      x-prd: [FR-4.2]
      x-screen: [S7]
      x-phase: P2
      security:
        - UserSession: []
        - TaskToken: []
      responses:
        '200':
          description: 목록.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Decision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [artifacts]
      operationId: recordDecision
      summary: 결정 기록(`colab decision record --summary --rationale`)
      description: |
        권한: `TaskToken`(에이전트, `source: agent`, `ref_id` = task). HITL 응답에서 나온 결정(`source: hitl`)은 `respondHitlRequest`가 만든다.
      x-colab-cli: decision record
      x-prd: [FR-4.2, FR-7.4]
      x-phase: P2
      security:
        - TaskToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary]
              properties:
                summary: { type: string, minLength: 1 }
                rationale: { type: string }
      responses:
        '201':
          description: 기록됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── cost ─────────────────────────────
  /sessions/{sessionId}/cost:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [cost]
      operationId: getSessionCost
      summary: 세션 비용(agent · task · 런타임별, 추정 배지)
      description: |
        권한: 워크스페이스 멤버.
        `estimated: true`면 `usage=false` 런타임의 추정치가 섞여 있다(FR-7.3, E9-07).
      x-prd: [FR-7.3]
      x-screen: [S7]
      x-phase: P3
      responses:
        '200':
          description: 집계.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostReport' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/cost:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [cost]
      operationId: getWorkspaceCost
      summary: 워크스페이스 비용(세션 · agent · 런타임 · 테스트 채팅)
      description: |
        권한: 워크스페이스 멤버.
        테스트 채팅 비용은 세션이 아니므로 `by_session`에 없고 `test_chat_usd`로 따로 준다(FR-1.8.1).
      x-prd: [FR-7.3, FR-1.8.1]
      x-screen: [S14, S9]
      x-phase: P3
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: agent_id
          in: query
          schema: { type: string, format: uuid }
        - name: runtime_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 집계.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── realtime ─────────────────────────────
  /workspaces/{workspaceId}/stream:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [realtime]
      operationId: streamEvents
      summary: SSE 이벤트 스트림(워크스페이스 단위)
      description: |
        권한: 워크스페이스 멤버. 인박스 이벤트는 호출자 본인 것만 흐른다.
        **SSE 하나**(`text/event-stream`). 클라이언트 → 서버 동작은 전부 REST이므로 WS가 필요 없고, 재연결 시 `Last-Event-ID`로 놓친 이벤트를 채우는 것이 표준 동작이다(SCREEN §6 "끊긴 채로 낡은 화면을 보여주지 않는다"). 각 SSE 프레임: `id`(단조 증가 커서) · `event`(`StreamEvent.type`) · `data`(`StreamEvent` JSON). 15초마다 `: ping` 코멘트. 보존 창(기본 10분)을 넘긴 `Last-Event-ID`면 첫 프레임으로 `resync`를 보내 화면이 REST로 다시 읽게 한다.
        `session_id`로 구독 범위를 좁힌다(S7). 고빈도 이벤트(`message.delta` · `agent.typing` · `test_chat.delta`)는 영속되지 않으며 백필되지 않는다(PRD §7).
      x-prd: [§8.1, SCREEN §6]
      x-screen: [S5, S7, S8, S11, S12, S13, S10]
      x-phase: P1
      parameters:
        - name: session_id
          in: query
          description: 세션 범위 이벤트만(여러 개 가능). 비우면 워크스페이스 전체(S5·S8·S11 수준).
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: test_chat_id
          in: query
          schema: { type: string, format: uuid }
        - name: Last-Event-ID
          in: header
          description: 재연결 백필 커서.
          schema: { type: string }
      responses:
        '200':
          description: 이벤트 스트림.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StreamEvent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── cli ─────────────────────────────
  /cli/context:
    get:
      tags: [cli]
      operationId: getCliContext
      summary: 토큰이 가리키는 task · lane · 세션 · 에이전트
      description: |
        권한: `TaskToken`.
        colab CLI가 **필요할 때**(세션·task 식별자 해석, 참여자 로스터, `last_seq`) 호출하고 프로세스 안에서 캐시한다 — **프로세스당 최대 1회**. 무조건 전처리로 부르면 모든 명령의 요청 수가 2배가 되는데, 폐기 토큰 방어(FR-9.1)는 각 명령의 본 요청이 `401`을 받는 것으로 이미 성립한다. 토큰이 폐기됐으면 `401 token_revoked`(재큐잉, FR-9.1) — CLI는 즉시 종료해야 한다. 열린 HITL 여부(`open_hitl_request_id`)와 억제 중인 위임자(`suppressed_delegator_agent_id`, 규칙 8)도 준다.
      x-colab-cli: (필요 시 1회, 캐시)
      x-prd: [FR-7.4, FR-9.1]
      x-phase: P1
      security:
        - TaskToken: []
      responses:
        '200':
          description: 컨텍스트.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CliContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

components:
  # ───────────────────────────── security ─────────────────────────────
  securitySchemes:
    UserSession:
      type: apiKey
      in: cookie
      name: colab_session
      description: 로그인(S1/S2)으로 발급되는 사용자 세션 쿠키(HttpOnly · SameSite=Lax). 웹 클라이언트 기본 인증. 사람의 모든 권한 판정은 이 사용자 = originator 기준.
    TaskToken:
      type: http
      scheme: bearer
      bearerFormat: COLAB_TASK_TOKEN
      description: |
        task마다 발급되는 단기 토큰(`COLAB_TASK_TOKEN`, 형식은 `contracts/colab-cli.md`). 그 task의 세션·에이전트 범위 밖에는 접근할 수 없다(FR-7.4). 재큐잉·취소 시 서버가 폐기하며(FR-9.1) 이후 호출은 `401 token_revoked`. 테스트 채팅에는 발급되지 않는다(FR-1.8.1). `x-colab-cli`가 붙은 operation만 이 스킴을 받는다.

  # ───────────────────────────── parameters ─────────────────────────────
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteToken:
      name: inviteToken
      in: path
      required: true
      schema: { type: string }
    RuntimeId:
      name: runtimeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TestChatId:
      name: testChatId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LaneId:
      name: laneId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HitlRequestId:
      name: hitlRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: 이전 응답의 `next_cursor`. 불투명 문자열.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: "클라이언트가 만든 UUID. 같은 키의 재요청은 첫 응답을 그대로 돌려준다(`Idempotent-Replayed: true`). 키는 24시간 보존. 같은 키에 다른 본문이면 `422 idempotency_key_reused`."
      schema: { type: string, format: uuid }
    ClientSeq:
      name: X-Colab-Client-Seq
      in: header
      required: false
      description: "colab CLI가 보내는 이 task의 client seq(attempt 무관, 1부터 단조 증가). 서버는 idempotency_key.client_seq에 저장하고 CliContext.last_seq = max(client_seq)로 답한다(v0.4, PR #22 리뷰 R1). 헤더가 없으면(웹·구버전 CLI) 서버가 UUIDv5(task:<task_id>:<n>)를 n=1부터 순서대로 대조해 마지막 존재 seq를 찾는다."
      schema: { type: integer, minimum: 1 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: 선택. 주면 `IdempotencyKeyRequired`와 같은 규칙.
      schema: { type: string, format: uuid }

  headers:
    SetSessionCookie:
      description: '`colab_session=<token>; HttpOnly; SameSite=Lax; Path=/`'
      schema: { type: string }
    IdempotentReplayed:
      description: 이 응답이 같은 `Idempotency-Key`의 첫 응답을 재생한 것이면 `true`.
      schema: { type: boolean }

  # ───────────────────────────── responses (RFC 9457) ─────────────────────────────
  responses:
    Problem:
      description: 그 밖의 오류. 본문은 항상 `application/problem+json`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: "인증 없음 · 사용자 세션 만료 · TaskToken 폐기(`code: token_revoked`) 또는 만료."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            revoked:
              value: { type: 'https://colab.dev/problems/token-revoked', title: Task token revoked, status: 401, code: token_revoked, detail: 이 task는 재큐잉되어 토큰이 폐기되었다. 즉시 종료하라. }
    Forbidden:
      description: 권한 없음. 화면은 버튼을 숨기지 않고 비활성+`detail`을 보여준다(SCREEN §7). deputy 시점 제한이면 `can_respond_from`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            deputy_too_early:
              value: { type: 'https://colab.dev/problems/deputy-not-yet', title: Deputy cannot respond yet, status: 403, code: deputy_not_yet, detail: 'Director 응답 대기 중 · 14:30부터 승인 가능', can_respond_from: '2026-09-06T14:30:00Z' }
    NotFound:
      description: 없음(또는 다른 워크스페이스의 리소스 — 존재를 노출하지 않는다).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 상태 전이 불가 · 유일성 충돌 · 차단(활성 세션이 걸린 런타임, 더티 workdir, 열린 HITL 존재 등). `code`로 구분.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            runtime_has_active_sessions:
              value: { type: 'https://colab.dev/problems/runtime-has-active-sessions', title: Runtime has active sessions, status: 409, code: runtime_has_active_sessions, detail: 먼저 세션을 재바인딩하거나 종료하라., sessions: [{ id: 6f1a0000-0000-4000-8000-000000000001, title: 시장 조사 }] }
    Gone:
      description: "만료·취소된 토큰/초대/페어링(`code: invite_expired` · `invite_revoked` · `pairing_expired` · `test_chat_closed`)."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: 검증 실패. 필드별 사유는 `errors[]`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            session_create:
              value: { type: 'https://colab.dev/problems/validation', title: Validation failed, status: 422, code: validation_failed, errors: [{ field: runtime_id, code: required_for_isolation, message: worktree 격리는 실행 머신이 필수다. }, { field: completion_condition, code: criteria_met_alone, message: criteria_met은 단독으로 쓸 수 없다. }] }
    PayloadTooLarge:
      description: 업로드 크기 초과.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayTimeout:
      description: 데몬 응답 지연(저장소 검증 등 동기 데몬 왕복).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  # ───────────────────────────── schemas ─────────────────────────────
  schemas:
    # ── 공통 ──
    Problem:
      type: object
      description: RFC 9457 Problem Details + `code`(기계용 식별자) + `errors[]`(필드 검증) 확장.
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: 사람에게 보여줄 사유(화면의 비활성 툴팁·경고 문구). }
        instance: { type: string, format: uri }
        code:
          type: string
          description: 기계용 식별자(snake_case). 예 — `token_revoked` · `deputy_not_yet` · `hitl_already_open` · `not_participant` · `runtime_offline` · `no_runtime` · `workdir_dirty` · `runtime_has_active_sessions` · `invalid_transition` · `idempotency_key_reused` · `validation_failed` · `not_designated_reviewer` · `workdir_quota_exceeded` · `running_lanes`.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: JSON pointer 또는 필드명. }
              code: { type: string }
              message: { type: string }
        can_respond_from:
          type: [string, 'null']
          format: date-time
          description: "deputy 의 시점 제한(기한 절반 경과 시각)일 때만 시각. **권한이 영영 없는 사람(일반 멤버 등)에게는 비운다(null)** — 생기지 않을 권리에 시각을 약속하지 않는다(E7-11, PR #108)."
        sessions:
          type: array
          description: 차단 사유가 된 세션(런타임 삭제 409 등).
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
      additionalProperties: true

    Page:
      type: object
      description: 커서 페이지 공통 봉투. `items`는 각 operation이 정한다.
      required: [items, next_cursor]
      properties:
        items: { type: array, items: {} }
        next_cursor:
          type: [string, 'null']
          description: 다음 페이지 커서. null이면 끝.

    # ── ENUM (0001_init.sql과 동일) ──
    MemberRole:
      type: string
      enum: [owner, admin, member]
      description: '`member_role`'
    RuntimeStatus:
      type: string
      enum: [online, offline]
      description: '`runtime_status`'
    RuntimeKind:
      type: string
      enum: [claude_code, antigravity, hermes]
      description: '`runtime_kind` (FR-1.6)'
    AgentRole:
      type: string
      enum: [lead, researcher, writer, engineer, reviewer, custom]
      description: '`agent_role` (FR-1.1)'
    AgentStatus:
      type: string
      enum: [idle, working, waiting_human, error, offline, disabled]
      description: '`agent_status` — 저장하지 않고 FR-1.3 순서로 파생한다.'
    RespondTo:
      type: string
      enum: [owner, allowlist, workspace, nobody]
      description: '`respond_to` (FR-1.9). `nobody`는 킬 스위치.'
    IsolationKind:
      type: string
      enum: [worktree, container, none]
      description: '`isolation_kind` (FR-2.1). v1 화면은 worktree · none — container는 v1.1.'
    AutonomyLevel:
      type: string
      enum: [supervised, guided, autonomous]
      description: '`autonomy_level` (FR-2.1). supervised는 v1.1.'
    SessionStatus:
      type: string
      enum: [draft, active, paused, completing, completed, cancelled]
      description: '`session_status` (FR-2.3)'
    PauseReason:
      type: string
      enum: [budget, time, loop, runtime_offline, director]
      description: '`pause_reason` (FR-2.3 · FR-7.3 · FR-9.2)'
    ContextType:
      type: string
      enum: [doc, url, file, session]
      description: '`context_type`'
    WorkdirKind:
      type: string
      enum: [worktree, container, dir]
      description: '`workdir_kind`'
    WorkdirStatus:
      type: string
      enum: [active, retained, deleted]
      description: '`workdir_status`'
    AuthorType:
      type: string
      enum: [user, agent, system]
      description: '`author_type` (FR-3.1)'
    MessageKind:
      type: string
      enum: [text, hitl, blocked_q, system, summary]
      description: '`message_kind`'
    MessageState:
      type: string
      enum: [posted, pending_approval]
      description: '`message_state` — pending_approval은 v1.1 supervised.'
    LaneStatus:
      type: string
      enum: [queued, running, waiting_human, blocked, paused, done, failed]
      description: '`lane_status` (FR-6.2)'
    TaskStatus:
      type: string
      enum: [deferred, queued, dispatched, preparing, running, waiting_human, paused, completed, failed, cancelled]
      description: '`task_status` (FR-7.1)'
    FailureKind:
      type: string
      enum: [auth, quota, config, network, runtime_offline, stall, timeout, cancelled, other]
      description: '`failure_kind`. auth · quota · config는 재시도 없음(→ 에이전트 `error`).'
    HitlSource:
      type: string
      enum: [agent, system]
      description: '`hitl_source`'
    HitlType:
      type: string
      enum: [question, choice, approval, info]
      description: '`hitl_type` (FR-5.1). v1은 question · approval.'
    HitlStatus:
      type: string
      enum: [open, answered, auto_answered, cancelled]
      description: "`hitl_status` (FR-5.4). expired는 없다 — open + overdue. `cancelled`(K-4, P3)는 **플랫폼 발행 HITL 이 발행 조건을 잃었을 때** 서버가 닫는 상태 — `user_approval` 은 종료 조건이 다시 미충족(아티팩트 철회 등), `budget`·`loop`·`time` 은 세션 재개·취소로 무의미해진 경우. 사람이 답하지 않았으므로 결정 기록 없음, 인박스 항목 제거, 카드는 취소됨 표시. 에이전트 발행(`agent`) HITL 은 task 취소·킬 스위치 때만."
    DecisionSource:
      type: string
      enum: [hitl, agent]
      description: '`decision_source`'
    InboxItemType:
      type: string
      enum: [hitl_request, lane_blocked, session_completed, session_paused, run_failed, runtime_offline, mention]
      description: '`inbox_item_type` (FR-8)'
    InboxSeverity:
      type: string
      enum: [action_required, attention, info]
      description: '`inbox_severity` (SCREEN §4.6)'
    TestChatStatus:
      type: string
      enum: [open, closed]
      description: '`test_chat_status`'
    SubscriptionLevel:
      type: string
      enum: [all, hitl_only, completion_only]
      description: 세션 구독(FR-8 전부 / HITL만 / 종료만). 스키마 v0에 컬럼이 없다 — 미결(openapi.md).
    AgentTemplateKey:
      type: string
      enum: [research_team, dev_team, content_team]
      description: FR-1.4 팀 템플릿 3종.

    # ── 사람 · 워크스페이스 ──
    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        created_at: { type: string, format: date-time }

    Me:
      type: object
      required: [user, workspaces, pending_invites]
      properties:
        user: { $ref: '#/components/schemas/User' }
        workspaces:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Workspace'
              - type: object
                required: [my_role]
                properties:
                  my_role: { $ref: '#/components/schemas/MemberRole' }
        pending_invites:
          type: array
          description: 내 이메일로 온 대기 중 초대(S2.1 "초대 대기 목록").
          items: { $ref: '#/components/schemas/InvitePreview' }

    AuthResult:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accepted_invite: { $ref: '#/components/schemas/Member' }
        return_to: { type: [string, 'null'], description: 보호된 URL에서 왔다면 복귀 경로(클라이언트가 넘긴 값 에코). }

    Workspace:
      type: object
      required: [id, name, slug, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Member:
      type: object
      required: [id, workspace_id, user, role, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/User' }
        role: { $ref: '#/components/schemas/MemberRole' }
        created_at: { type: string, format: date-time }

    Invite:
      type: object
      required: [id, workspace_id, role, token, url, expires_at, created_at, status]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        email: { type: [string, 'null'], format: email }
        role: { $ref: '#/components/schemas/MemberRole' }
        token: { type: string }
        url: { type: string, format: uri, description: 복사해서 전달할 링크. }
        invited_by: { $ref: '#/components/schemas/User' }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        status:
          type: string
          enum: [pending, accepted, expired, revoked]

    InvitePreview:
      type: object
      required: [token, workspace, role, invited_by, expires_at]
      properties:
        token: { type: string }
        workspace: { $ref: '#/components/schemas/Workspace' }
        role: { $ref: '#/components/schemas/MemberRole' }
        invited_by: { $ref: '#/components/schemas/User' }
        expires_at: { type: string, format: date-time }

    OnboardingStatus:
      type: object
      required: [workspace_created, runtime_connected, agent_created]
      properties:
        workspace_created: { type: boolean }
        runtime_connected: { type: boolean, description: 데몬이 붙고 CLI 1종 이상 감지. }
        agent_created: { type: boolean }

    WorkspaceSettings:
      type: object
      description: '`workspace_settings` 행 그대로. 기본값은 PRD §7.'
      required: [workspace_id, loop_limits, budget_policy, context_reuse, default_isolation, runtime_policy, workdir_retention_days, workdir_disk_quota_gb, runtime_offline_grace, task_event_masking, updated_at]
      properties:
        workspace_id: { type: string, format: uuid }
        loop_limits: { $ref: '#/components/schemas/LoopLimits' }
        budget_policy: { $ref: '#/components/schemas/BudgetPolicy' }
        context_reuse: { $ref: '#/components/schemas/ContextReusePolicy' }
        default_isolation: { $ref: '#/components/schemas/IsolationKind' }
        runtime_policy: { $ref: '#/components/schemas/RuntimePolicy' }
        workdir_retention_days: { type: integer, minimum: 0, default: 14 }
        workdir_disk_quota_gb: { type: [integer, 'null'], minimum: 1 }
        runtime_offline_grace:
          type: string
          description: ISO 8601 duration(Postgres interval). 기본 `P7D`.
          default: P7D
        task_event_masking: { type: boolean, default: false, description: 보안 탭 — diff·셸 출력을 요약만 저장(owner만 변경). }
        updated_at: { type: string, format: date-time }

    WorkspaceSettingsUpdate:
      type: object
      description: 부분 갱신. 모든 필드 선택.
      properties:
        loop_limits: { $ref: '#/components/schemas/LoopLimits' }
        budget_policy: { $ref: '#/components/schemas/BudgetPolicy' }
        context_reuse: { $ref: '#/components/schemas/ContextReusePolicy' }
        default_isolation: { $ref: '#/components/schemas/IsolationKind' }
        runtime_policy: { $ref: '#/components/schemas/RuntimePolicy' }
        workdir_retention_days: { type: integer, minimum: 0 }
        workdir_disk_quota_gb: { type: [integer, 'null'], minimum: 1 }
        runtime_offline_grace: { type: string }
        task_event_masking: { type: boolean }

    LoopLimits:
      type: object
      description: FR-3.5.
      properties:
        max_chain_depth: { type: integer, minimum: 1, default: 8 }
        max_hops_per_hour: { type: integer, minimum: 1, default: 60 }
        max_pair_roundtrips: { type: integer, minimum: 1, default: 5 }

    BudgetPolicy:
      type: object
      description: FR-7.3. 스키마 v0는 `jsonb '{}'` — 키는 이 문서가 정한다(미결 항목 참조).
      properties:
        default_session_budget_usd: { type: [number, 'null'], minimum: 0 }
        default_task_budget_usd: { type: [number, 'null'], minimum: 0 }
        workspace_monthly_budget_usd: { type: [number, 'null'], minimum: 0 }
        pricing_overrides:
          type: object
          description: 추정치 계산용 모델별 단가(USD per 1M tokens). 키는 모델 id.
          additionalProperties:
            type: object
            properties:
              input: { type: number }
              output: { type: number }
              cache_read: { type: number }

    ContextReusePolicy:
      type: object
      description: FR-4.4.
      properties:
        max_summary_tokens: { type: integer, minimum: 0, default: 2000 }
        include_artifacts:
          type: string
          enum: [links, none, full]
          default: links

    RuntimePolicy:
      type: object
      description: FR-9 데몬 전역 상한.
      properties:
        max_concurrent_tasks: { type: integer, minimum: 1, default: 10 }
        per_kind:
          type: object
          description: 런타임 종류별 상한.
          additionalProperties: { type: integer, minimum: 1 }

    NotificationSettings:
      type: object
      required: [email, push, default_subscription]
      properties:
        email: { type: boolean, default: true }
        push: { type: boolean, default: false }
        default_subscription: { $ref: '#/components/schemas/SubscriptionLevel' }

    # ── 런타임 ──
    RuntimeCapability:
      type: object
      description: 'probe() 항목: `capabilities` jsonb 원소. **contracts/protocol.go `Capability`와 키가 1:1**(v0.4.1, PR #26 대조표 — 이전 transport[]·usage_reporting·options는 protocol.go에 없어 채워지지 않았다). 데몬 → 서버 → 웹이 같은 모양을 쓴다(harness.md §9).'
      required: [kind, logged_in]
      properties:
        kind: { $ref: '#/components/schemas/RuntimeKind' }
        version: { type: [string, 'null'], description: '런타임 CLI 버전(예 Claude Code 2.1.258, Hermes 0.20.6).' }
        adapter_version: { type: [string, 'null'], description: 'ACP 어댑터 실측 버전. 실측 실패 시 null(핀 상수로 채우지 않는다).' }
        logged_in: { type: boolean }
        models:
          type: array
          items: { type: string }
        protocol_version: { type: [integer, 'null'], description: 'ACP initialize 응답. v1은 1.' }
        resume: { type: boolean, description: 'session/load 지원 — harness §6' }
        usage: { type: boolean, description: '사용량 보고 여부. false면 비용은 추정 배지(FR-7.3)' }
        tool_disallow: { type: boolean, description: '툴 차단 수단 존재(harness §3)' }
        brief_transport:
          type: [string, 'null']
          enum: [acp_meta_system_prompt, instruction_file]
          description: '브리프 전달 경로(harness §1). 값이 없으면 필드를 생략하거나 null — enum에 null을 넣지 않는다(생성기가 상수 ''<nil>''을 만든다, v0.4.2).'
        allow_once_missing: { type: boolean, description: '권한 협상에서 allow_once 부재 3회 누적(E12-03)' }
        supported_options:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: '이 런타임이 받는 프로파일 옵션과 허용 값(v0.5). 예 `{effort: [low, medium, high, xhigh]}`. PRD §8.2.6 "세션이 광고한 능력 범위 내에서만"의 그 광고다 — v0.4.1 에서 protocol.go 대조 중 빠졌는데, createProfile 의 422 규칙과 S10 의 "미지원 옵션 비활성 + 사유"(SCREEN §4.7)가 둘 다 이 값을 전제한다. 데몬이 (kind, adapter_version) 으로 아는 범위를 채운다. **키가 없거나 비어 있으면 "광고 없음"** — 웹은 옵션 편집을 비활성으로 두고 사유를 보이며, 서버는 어떤 옵션 값도 받지 않는다(빈 광고 = 허용 없음).'
        tool_surface:
          type: [string, 'null']
          enum: [mcp, cli_wrapper]
          description: '에이전트가 플랫폼에 말하는 수단(harness §10 v0.8). `mcp` = session/new.mcpServers 를 존중(claude_code). `cli_wrapper` = MCP 를 무시하는 런타임(hermes) — 데몬이 attempt 별 래퍼 실행 파일을 만들고 브리프에 절대 경로를 적는다. 판정은 initialize 응답의 mcpCapabilities 유무. 값이 없으면 필드 생략.'

    RuntimeRepo:
      type: object
      description: '`repos` jsonb 원소(FR-9). `remote_url`이 재바인딩 "같은 저장소" 키.'
      required: [path]
      properties:
        path: { type: string }
        remote_url: { type: [string, 'null'] }
        branch: { type: [string, 'null'] }
        clean: { type: [boolean, 'null'] }

    Runtime:
      type: object
      required: [id, workspace_id, name, status, capabilities, repos, running_task_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        host: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RuntimeStatus' }
        daemon_version: { type: [string, 'null'] }
        last_seen_at: { type: [string, 'null'], format: date-time }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/RuntimeCapability' }
        repos:
          type: array
          items: { $ref: '#/components/schemas/RuntimeRepo' }
        max_concurrent_tasks: { type: [integer, 'null'], description: 런타임별 상한. null이면 워크스페이스 정책. }
        running_task_count: { type: integer }
        workdir_disk_bytes: { type: integer, format: int64, description: workdir 사용량 합계. }
        colab_cli: { $ref: '#/components/schemas/ColabCLI' }
        offline_since: { type: [string, 'null'], format: date-time }
        grace_ends_at: { type: [string, 'null'], format: date-time, description: 7일 유예 만료 시각(오프라인일 때). }
        paused_session_count: { type: integer, description: 유예를 넘겨 `paused(runtime_offline)`된 세션 수. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ColabCLI:
      type: object
      required: [present, version]
      description: '머신에 설치된 colab CLI. **런타임 속성이 아니라 머신 속성**이라 `capabilities[]`가 아니라 probe 최상위에 한 번 실린다(daemon-protocol.md §3, v0.5) — 런타임이 둘이어도 바이너리는 하나고, 런타임이 0개인 머신에서도 보고돼야 한다. 에이전트는 colab CLI로 서버에 말하므로 `present: false`면 세션이 조용히 아무 말도 못 한다: S11·S12 카드는 이걸 경고로 드러낸다.'
      properties:
        present: { type: boolean }
        version: { type: string, description: '미설치·실행 실패면 빈 문자열.' }

    RuntimeDetail:
      allOf:
        - $ref: '#/components/schemas/Runtime'
        - type: object
          required: [active_sessions]
          properties:
            active_sessions:
              type: array
              items: { $ref: '#/components/schemas/SessionRef' }

    Pairing:
      type: object
      required: [id, status, install_commands, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [waiting, connected, probing, ready, expired]
          description: S12 4단계 + 만료.
        install_commands:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
          description: 복사 버튼 2줄(설치 · 페어링).
        pairing_token: { type: string, description: 1회용. 교환 후 무효. }
        runtime: { $ref: '#/components/schemas/Runtime' }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    RepoCheck:
      type: object
      required: [ok, repo_path, exists]
      properties:
        ok: { type: boolean }
        repo_path: { type: string }
        exists: { type: boolean }
        is_git: { type: boolean }
        clean: { type: [boolean, 'null'] }
        default_branch: { type: [string, 'null'] }
        current_branch: { type: [string, 'null'] }
        remote_url: { type: [string, 'null'] }
        tracks_brief_file: { type: [boolean, 'null'], description: '`CLAUDE.md`/`AGENTS.md`가 추적 중인지(§8.4 오염 방지 경로 안내용).' }
        problems:
          type: array
          items: { type: string }
        checked_at: { type: string, format: date-time }

    RuntimeCandidate:
      type: object
      required: [runtime, eligible]
      properties:
        runtime: { $ref: '#/components/schemas/Runtime' }
        eligible: { type: boolean }
        reason: { type: [string, 'null'], description: eligible=false일 때 사유(오프라인 · 저장소 없음 · remote 불일치). }
        matched_repo: { $ref: '#/components/schemas/RuntimeRepo' }

    Workdir:
      type: object
      required: [id, session_id, kind, path_or_ref, status, disk_bytes, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        session: { $ref: '#/components/schemas/SessionRef' }
        agent_id: { type: [string, 'null'], format: uuid, description: worktree — 에이전트당 1개. }
        lane_id: { type: [string, 'null'], format: uuid, description: container · none — lane당 1개. }
        kind: { $ref: '#/components/schemas/WorkdirKind' }
        path_or_ref: { type: string }
        branch: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/WorkdirStatus' }
        disk_bytes: { type: integer, format: int64 }
        last_used_at: { type: [string, 'null'], format: date-time }
        retain_until: { type: [string, 'null'], format: date-time }
        dirty:
          type: [boolean, 'null']
          description: 미병합 커밋 또는 미커밋 변경이 있음(GC 차단 · 수동 삭제 경고, FR-6.4 M4). 데몬 마지막 보고 기준.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── 에이전트 ──
    AgentProfile:
      type: object
      description: FR-1.6. 프로파일은 머신을 고르지 않는다 — 실행 머신은 세션 `runtime_id`.
      required: [id, agent_id, name, runtime_kind, model, options, env, args, is_default, fallback_profile_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        name: { type: string }
        runtime_kind: { $ref: '#/components/schemas/RuntimeKind' }
        model: { type: string }
        options:
          type: object
          additionalProperties: true
          description: "예 `{effort: xhigh}`. 세션이 광고한 능력 범위 안(§8.2.6)."
        env:
          type: object
          additionalProperties: { type: string }
        args:
          type: array
          items: { type: string }
        is_default: { type: boolean }
        fallback_profile_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentProfileCreate:
      type: object
      required: [name, runtime_kind, model]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        runtime_kind: { $ref: '#/components/schemas/RuntimeKind' }
        model: { type: string, minLength: 1 }
        options: { type: object, additionalProperties: true, default: {} }
        env: { type: object, additionalProperties: { type: string }, default: {} }
        args: { type: array, items: { type: string }, default: [] }
        is_default: { type: boolean, default: false }
        fallback_profile_id: { type: [string, 'null'], format: uuid }
        fallback_profile:
          type: [string, 'null']
          description: 생성 시 같은 배열 안의 다른 프로파일을 **이름**으로 가리킬 때(FR-1.7 `.agent.md` 형식과 같다).

    AgentProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        runtime_kind: { $ref: '#/components/schemas/RuntimeKind' }
        model: { type: string, minLength: 1 }
        options: { type: object, additionalProperties: true }
        env: { type: object, additionalProperties: { type: string } }
        args: { type: array, items: { type: string } }
        is_default: { type: boolean }
        fallback_profile_id: { type: [string, 'null'], format: uuid }

    Agent:
      type: object
      description: 정의 필드 + 인스턴스 필드(FR-1.8). `status`는 파생값.
      required: [id, workspace_id, name, role, role_description, instructions, tools, owner_id, respond_to, respond_to_allowlist, max_concurrent_tasks, status, profiles, invitable, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/AgentRole' }
        role_description: { type: string }
        instructions: { type: string }
        tools:
          type: array
          items: { type: string }
          description: 허용 도구/스킬/MCP 서버.
        owner_id: { type: string, format: uuid }
        owner: { $ref: '#/components/schemas/User' }
        respond_to: { $ref: '#/components/schemas/RespondTo' }
        respond_to_allowlist:
          type: array
          items: { type: string, format: uuid }
        avatar_url: { type: [string, 'null'], format: uri }
        budget_per_task: { type: [number, 'null'], description: USD. HITL 예산 승인으로는 바뀌지 않는다(C2′). }
        max_concurrent_tasks: { type: integer, default: 3 }
        definition_source: { type: [string, 'null'] }
        definition_version: { type: [string, 'null'] }
        definition_update_available: { type: [string, 'null'], description: '"이 팩의 v3에서 왔고 현재 v5가 있음"의 v5(E15-10).' }
        status: { $ref: '#/components/schemas/AgentStatus' }
        profiles:
          type: array
          items: { $ref: '#/components/schemas/AgentProfile' }
        invitable:
          type: object
          description: 호출자가 이 에이전트를 세션에 초대할 수 있는가(FR-1.9).
          required: [allowed]
          properties:
            allowed: { type: boolean }
            reason: { type: [string, 'null'] }
        usage:
          type: object
          description: 누적 사용량(인스턴스 필드).
          properties:
            cost_usd: { type: number }
            task_count: { type: integer }
        archived_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentCreate:
      type: object
      required: [name, role, role_description, instructions, profiles]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: 멘션 라벨. 워크스페이스 내 유일. }
        role: { $ref: '#/components/schemas/AgentRole' }
        role_description: { type: string, minLength: 1 }
        instructions: { type: string, minLength: 1 }
        profiles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AgentProfileCreate' }
          description: 정확히 하나가 `is_default`(없으면 첫 번째).
        tools: { type: array, items: { type: string }, default: [] }
        max_concurrent_tasks: { type: integer, minimum: 1, default: 3 }
        avatar_url: { type: [string, 'null'], format: uri }
        respond_to:
          allOf: [{ $ref: '#/components/schemas/RespondTo' }]
          default: owner
        respond_to_allowlist: { type: array, items: { type: string, format: uuid }, default: [] }
        budget_per_task: { type: [number, 'null'], minimum: 0 }

    AgentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        role: { $ref: '#/components/schemas/AgentRole' }
        role_description: { type: string, minLength: 1 }
        instructions: { type: string, minLength: 1 }
        tools: { type: array, items: { type: string } }
        max_concurrent_tasks: { type: integer, minimum: 1 }
        avatar_url: { type: [string, 'null'], format: uri }
        respond_to: { $ref: '#/components/schemas/RespondTo' }
        respond_to_allowlist: { type: array, items: { type: string, format: uuid } }
        budget_per_task: { type: [number, 'null'], minimum: 0 }
        apply_definition_update: { type: boolean, description: '`definition_update_available`을 적용(FR-1.8 명시 업데이트).' }

    AgentTemplate:
      type: object
      required: [key, name, description, agents]
      properties:
        key: { $ref: '#/components/schemas/AgentTemplateKey' }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        agents:
          type: array
          items:
            type: object
            required: [key, name, role, role_description, mapping]
            properties:
              key: { type: string }
              name: { type: string }
              role: { $ref: '#/components/schemas/AgentRole' }
              role_description: { type: string }
              mapping:
                type: object
                description: 이 워크스페이스 런타임으로의 프로파일 자동 매핑 결과.
                required: [status]
                properties:
                  status: { type: string, enum: [mapped, unmapped] }
                  runtime_kind: { $ref: '#/components/schemas/RuntimeKind' }
                  model: { type: string }
                  reason: { type: [string, 'null'] }

    TestChat:
      type: object
      required: [id, workspace_id, agent_id, profile_id, user_id, status, turns, input_tokens, output_tokens, cost_usd, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        runtime_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TestChatStatus' }
        transport: { type: [string, 'null'], enum: [acp, cli, null], description: 실제 사용된 경로. 사용자에게 보여준다(FR-1.8.1). }
        turns:
          type: array
          items: { $ref: '#/components/schemas/TestChatTurn' }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost_usd: { type: number }
        estimated: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }

    TestChatTurn:
      type: object
      required: [role, content, at]
      properties:
        role: { type: string, enum: [user, agent] }
        content: { type: string }
        at: { type: string, format: date-time }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
        error: { type: [string, 'null'] }

    # ── 세션 ──
    SessionRef:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/SessionStatus' }

    Isolation:
      type: object
      description: '`session.isolation` jsonb. kind별로 `repo_path`(worktree) · `image`(container).'
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/IsolationKind' }
        repo_path: { type: string }
        remote_url: { type: [string, 'null'], description: 생성 시 `checkRepo` 결과로 서버가 채운다 — 재바인딩 판정 키. }
        image: { type: string }

    SessionLimits:
      type: object
      description: FR-2.1 `limits`. 초과는 종료가 아니라 `paused`.
      properties:
        budget_usd: { type: [number, 'null'], minimum: 0 }
        budget_tokens: { type: [integer, 'null'], minimum: 0 }
        time_limit: { type: [string, 'null'], description: ISO 8601 duration(예 `PT4H`). }
        max_tasks: { type: [integer, 'null'], minimum: 1 }
        max_parallel_lanes: { type: integer, minimum: 1, default: 5 }

    CompletionCondition:
      description: FR-2.2 AND/OR 트리. 그룹 `{op, conditions[]}` 또는 원자 `{type, …}`. 스키마 v0 기본값 `{"op":"and","conditions":[{"type":"artifact_submitted","who":"assignee"},{"type":"user_approval"}]}`.
      oneOf:
        - $ref: '#/components/schemas/CompletionGroup'
        - $ref: '#/components/schemas/CompletionAtom'

    CompletionGroup:
      type: object
      required: [op, conditions]
      properties:
        op: { type: string, enum: [and, or] }
        conditions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CompletionCondition' }

    CompletionAtom:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [artifact_submitted, agent_approval, user_approval, criteria_met, manual]
        who:
          type: string
          description: '`artifact_submitted`: `assignee` 또는 역할명.'
        agent_id:
          type: string
          format: uuid
          description: '`artifact_submitted` · `agent_approval`의 지정 에이전트(`who` 대신).'

    CompletionProgress:
      type: object
      description: S7 우열 "종료 조건 진행률" — 조건별 충족 여부와 누구 차례인지.
      required: [met, total, satisfied, conditions]
      properties:
        met: { type: integer }
        total: { type: integer }
        satisfied: { type: boolean, description: 트리 전체 판정. true면 `completing`으로 간다. }
        human_gate: { type: boolean, description: 트리에 `user_approval`·`manual`이 있는가. false면 "사람 승인 없이 완료됩니다"(m-m). }
        conditions:
          type: array
          items:
            type: object
            required: [path, type, met]
            properties:
              path: { type: string, description: 트리 내 위치(예 `/conditions/0`). }
              type: { type: string }
              met: { type: boolean }
              met_at: { type: [string, 'null'], format: date-time }
              met_by: { type: [string, 'null'], description: 충족시킨 주체(에이전트 id · 사용자 id · platform). }
              next_actor: { type: [string, 'null'], description: 누가 충족시킬 차례인지(표시용). }
              hitl_request_id: { type: [string, 'null'], format: uuid, description: '`user_approval` 대기 중이면 그 HITL.' }

    SessionContext:
      type: object
      required: [id, type, ref]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ContextType' }
        ref: { type: string, description: url · storage ref · session id. }
        summary: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    SessionContextCreate:
      type: object
      required: [type, ref]
      properties:
        type: { $ref: '#/components/schemas/ContextType' }
        ref: { type: string }

    PausedDetail:
      type: object
      description: 사유 5종별 배너·해결 동작 데이터(SCREEN §4.5 O6).
      required: [reason, paused_at]
      properties:
        reason: { $ref: '#/components/schemas/PauseReason' }
        paused_at: { type: string, format: date-time }
        budget:
          type: object
          properties:
            limit_usd: { type: number }
            spent_usd: { type: number }
        time:
          type: object
          properties:
            limit: { type: string }
            elapsed: { type: string }
        loop:
          type: object
          properties:
            limit: { type: string, enum: [chain_depth, hops_per_hour, pair_roundtrips] }
            count: { type: integer }
            agents:
              type: array
              description: pair_roundtrips일 때 두 에이전트.
              items: { type: string, format: uuid }
        runtime:
          type: object
          properties:
            runtime_id: { type: string, format: uuid }
            offline_since: { type: string, format: date-time }
        system_hitl_request_id: { type: [string, 'null'], format: uuid, description: 예산·시간·루프로 발행된 시스템 HITL. }
        resolve_actions:
          type: array
          description: 호출자가 지금 할 수 있는 동작.
          items: { type: string, enum: [resume, rebind, cancel] }
        can_resolve_from: { type: [string, 'null'], format: date-time, description: deputy면 언제부터. }

    Session:
      type: object
      required: [id, workspace_id, title, goal, acceptance_criteria, director_user_id, deputy_director_user_id, assignee_agent_id, runtime_id, isolation, completion_condition, completion_progress, limits, autonomy, status, paused_reason, cost_usd, created_by, created_at, updated_at, my_role]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        title: { type: string }
        goal: { type: string }
        acceptance_criteria: { type: array, items: { type: string } }
        director_user_id: { type: string, format: uuid }
        director: { $ref: '#/components/schemas/User' }
        deputy_director_user_id: { type: [string, 'null'], format: uuid }
        deputy_director: { $ref: '#/components/schemas/User' }
        assignee_agent_id: { type: [string, 'null'], format: uuid }
        runtime_id: { type: [string, 'null'], format: uuid, description: none 격리에서 자동 선택이면 첫 dispatch까지 null(M10). }
        runtime: { $ref: '#/components/schemas/Runtime' }
        isolation: { $ref: '#/components/schemas/Isolation' }
        completion_condition: { $ref: '#/components/schemas/CompletionCondition' }
        completion_progress: { $ref: '#/components/schemas/CompletionProgress' }
        limits: { $ref: '#/components/schemas/SessionLimits' }
        autonomy: { $ref: '#/components/schemas/AutonomyLevel' }
        context_reuse_override: { $ref: '#/components/schemas/ContextReusePolicy' }
        status: { $ref: '#/components/schemas/SessionStatus' }
        paused_reason: { oneOf: [{ $ref: '#/components/schemas/PauseReason' }, { type: 'null' }] }
        paused_detail: { $ref: '#/components/schemas/PausedDetail' }
        cost_usd: { type: number }
        cost_estimated: { type: boolean, description: 추정치 포함(FR-7.3 배지). }
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        context:
          type: array
          items: { $ref: '#/components/schemas/SessionContext' }
        my_role:
          type: string
          enum: [director, deputy, member]
          description: 호출자의 세션 역할(FR-5.3). TaskToken이면 `member`.
        subscription: { $ref: '#/components/schemas/SubscriptionLevel' }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        last_activity_at: { type: [string, 'null'], format: date-time }

    SessionListItem:
      type: object
      description: S5 행.
      required: [id, title, goal, status, paused_reason, director, participants, completion_progress, cost_usd, attention, running_lane_count, last_activity_at, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        goal: { type: string }
        status: { $ref: '#/components/schemas/SessionStatus' }
        paused_reason: { oneOf: [{ $ref: '#/components/schemas/PauseReason' }, { type: 'null' }] }
        director: { $ref: '#/components/schemas/User' }
        participants:
          type: array
          items:
            type: object
            required: [agent_id, name]
            properties:
              agent_id: { type: string, format: uuid }
              name: { type: string }
              avatar_url: { type: [string, 'null'], format: uri }
        completion_progress:
          type: object
          required: [met, total]
          properties:
            met: { type: integer }
            total: { type: integer }
        cost_usd: { type: number }
        budget_usd: { type: [number, 'null'] }
        cost_estimated: { type: boolean }
        attention:
          type: object
          description: 주의 배지 — HITL 대기 N · blocked N · 실패 N.
          required: [hitl_open, blocked, failed]
          properties:
            hitl_open: { type: integer }
            blocked: { type: integer }
            failed: { type: integer }
        running_lane_count: { type: integer }
        runtime_id: { type: [string, 'null'], format: uuid }
        last_activity_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    SessionCreate:
      type: object
      required: [title, goal, isolation, participants]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        goal: { type: string, minLength: 1 }
        acceptance_criteria: { type: array, items: { type: string }, default: [] }
        director_user_id: { type: string, format: uuid, description: 기본 생성자. }
        deputy_director_user_id: { type: [string, 'null'], format: uuid }
        runtime_id:
          type: [string, 'null']
          format: uuid
          description: worktree · container면 필수. none이면 null = "자동 선택(첫 실행 시 고정)".
        isolation: { $ref: '#/components/schemas/Isolation' }
        participants:
          type: array
          minItems: 1
          items:
            type: object
            required: [agent_id]
            properties:
              agent_id: { type: string, format: uuid }
              profile_id: { type: [string, 'null'], format: uuid, description: 비우면 기본 프로파일. }
        assignee_agent_id: { type: string, format: uuid, description: 기본 담당(보통 lead). 생략하면 첫 참여자. }
        context:
          type: array
          items: { $ref: '#/components/schemas/SessionContextCreate' }
          default: []
        completion_condition: { $ref: '#/components/schemas/CompletionCondition' }
        limits: { $ref: '#/components/schemas/SessionLimits' }
        autonomy:
          allOf: [{ $ref: '#/components/schemas/AutonomyLevel' }]
          default: guided
        context_reuse_override: { $ref: '#/components/schemas/ContextReusePolicy' }
        draft: { type: boolean, default: false, description: true면 `draft`로 저장만(초기 task 없음). }

    SessionUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        goal: { type: string, minLength: 1 }
        acceptance_criteria: { type: array, items: { type: string } }
        deputy_director_user_id: { type: [string, 'null'], format: uuid }
        limits: { $ref: '#/components/schemas/SessionLimits' }
        autonomy: { $ref: '#/components/schemas/AutonomyLevel' }
        context_reuse_override: { $ref: '#/components/schemas/ContextReusePolicy' }
        completion_condition:
          allOf: [{ $ref: '#/components/schemas/CompletionCondition' }]
          description: draft에서만.
        isolation:
          allOf: [{ $ref: '#/components/schemas/Isolation' }]
          description: draft에서만.
        runtime_id:
          type: [string, 'null']
          format: uuid
          description: draft에서만.

    Participant:
      type: object
      description: '`session_participant` + 파생 상태(FR-1.3).'
      required: [session_id, agent_id, agent, profile, status, is_assignee, joined_at]
      properties:
        session_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        agent:
          type: object
          required: [id, name, role, role_description]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            role: { $ref: '#/components/schemas/AgentRole' }
            role_description: { type: string }
            avatar_url: { type: [string, 'null'], format: uri }
            respond_to: { $ref: '#/components/schemas/RespondTo' }
        profile: { $ref: '#/components/schemas/AgentProfile' }
        status: { $ref: '#/components/schemas/AgentStatus' }
        status_note: { type: [string, 'null'], description: '칩 둘째 줄(예 "lane #2 질문 대기"). 상태 값이 아니다(N2).' }
        is_assignee: { type: boolean }
        mention_link: { type: string, description: '`[@이름](mention://agent/<id>)` — 로스터 붙여넣기용(FR-3.2).' }
        warnings:
          type: array
          items: { type: string }
          description: 예 "프로파일의 runtime_kind가 세션 런타임에 없음".
        joined_at: { type: string, format: date-time }

    # ── 메시지 ──
    Mention:
      type: object
      description: '`message.mentions[]` 정규화 원소(FR-3.2). 본문에는 원문 링크 `[@표시명](mention://agent/<id>)`가 그대로 남는다.'
      required: [kind, id]
      properties:
        kind: { type: string, enum: [agent, user, all] }
        id: { type: string, description: uuid 또는 `all`. }
        display_name: { type: string }

    Message:
      type: object
      required: [id, session_id, author_type, author_id, parent_id, content, mentions, source_task_id, kind, state, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        author_type: { $ref: '#/components/schemas/AuthorType' }
        author_id: { type: [string, 'null'], format: uuid, description: app_user 또는 agent. system이면 null. }
        author:
          type: object
          description: 표시용 해소값(uuid 노출 금지 원칙, FR-7.2).
          properties:
            name: { type: string }
            avatar_url: { type: [string, 'null'], format: uri }
            role: { $ref: '#/components/schemas/AgentRole' }
        parent_id: { type: [string, 'null'], format: uuid, description: 스레드 루트. }
        content: { type: string, description: 마크다운. }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/Mention' }
        source_task_id: { type: [string, 'null'], format: uuid }
        lane_id: { type: [string, 'null'], format: uuid, description: source_task의 lane(질문 카드·활동 보기 연결용). }
        kind: { $ref: '#/components/schemas/MessageKind' }
        state: { $ref: '#/components/schemas/MessageState' }
        hitl_request_id: { type: [string, 'null'], format: uuid, description: kind=hitl일 때. }
        reply_count: { type: integer }
        is_note: { type: boolean, description: '`/note` 접두(규칙 1 — 기록만).' }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }

    MessagePage:
      type: object
      required: [items, has_more_before, has_more_after]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        before_cursor: { type: [string, 'null'], description: 더 오래된 페이지 커서. }
        after_cursor: { type: [string, 'null'], description: 더 새로운 페이지 커서(백필 재개점). }
        has_more_before: { type: boolean }
        has_more_after: { type: boolean }
        total: { type: [integer, 'null'], description: "스레드 조회일 때 전체 수(`included/total/truncated` 표기용, E8-12)." }

    MessageCreate:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, description: 마크다운 + 멘션 링크. `/note ` 접두는 기록만. }
        parent_id: { type: [string, 'null'], format: uuid, description: 답글이면 스레드 루트(또는 스레드 내 메시지 — 서버가 루트로 정규화). }
        new_lane:
          type: boolean
          default: false
          description: '"새 lane으로 보내기" 토글(t-2). 해소 규칙 3을 건너뛴다. TaskToken에서는 무시(에이전트는 `delegateLane`).'
        suppress_agent_ids:
          type: array
          items: { type: string, format: uuid }
          default: []
          description: 이번 메시지에서만 트리거 억제(FR-3.6). 멘션은 본문에 남는다.

    TriggerPreview:
      type: object
      description: 규칙 1~8 + lane 해소 결과(게시 전).
      required: [triggers, warnings, note_only]
      properties:
        note_only: { type: boolean, description: 규칙 1(`/note`) — 트리거 없음. }
        implicit_routing_suppressed: { type: boolean, description: 규칙 3(@all · 사람만 멘션). }
        triggers:
          type: array
          items: { $ref: '#/components/schemas/TriggerTarget' }
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, description: '`not_participant` · `suppressed_delegator` · `loop_limit_near` · `agent_disabled`.' }
              message: { type: string }
              agent_id: { type: [string, 'null'], format: uuid }

    TriggerTarget:
      type: object
      required: [agent_id, agent_name, rule, lane, will_queue]
      properties:
        agent_id: { type: string, format: uuid }
        agent_name: { type: string }
        profile:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            runtime_kind: { $ref: '#/components/schemas/RuntimeKind' }
            model: { type: string }
        rule: { type: integer, minimum: 1, maximum: 8, description: 적용된 FR-3.3 규칙 번호. }
        lane:
          type: object
          description: lane 해소 결과.
          required: [resolution]
          properties:
            resolution: { type: integer, minimum: 1, maximum: 4, description: lane 해소 규칙 번호. }
            lane_id: { type: [string, 'null'], format: uuid, description: 재사용 lane. 새 lane이면 null. }
            reentry: { type: boolean, description: done·blocked 재진입. }
        will_queue: { type: boolean, description: 실행 중이라 큐잉(병합)된다. }
        deferred_until: { type: [string, 'null'], format: date-time, description: 규칙 7 assignee 폴백(5분 지연). }

    MessagePostResult:
      type: object
      required: [message, triggers, warnings]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        triggers:
          type: array
          description: 실제로 생성·병합된 task.
          items:
            type: object
            required: [agent_id, task_id, lane_id, coalesced]
            properties:
              agent_id: { type: string, format: uuid }
              task_id: { type: string, format: uuid }
              lane_id: { type: string, format: uuid }
              coalesced: { type: boolean, description: 기존 queued task에 병합됨(FR-3.4). }
              deferred_until: { type: [string, 'null'], format: date-time }
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              agent_id: { type: [string, 'null'], format: uuid }
        session_paused: { type: [string, 'null'], enum: [budget, time, loop, runtime_offline, director, null], description: 이 게시가 세션을 `paused`로 만들었다면 사유(루프 상한). }

    # ── lane · task ──
    Lane:
      type: object
      required: [id, session_id, parent_lane_id, agent_id, profile_id, depends_on, workdir_id, delegated_from_task_id, status, blocked_note, blocked_message_id, reentry_count, created_at, updated_at, finished_at, actions]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        parent_lane_id: { type: [string, 'null'], format: uuid }
        agent_id: { type: string, format: uuid }
        agent_name: { type: string }
        profile_id: { type: string, format: uuid }
        depends_on: { type: array, items: { type: string, format: uuid } }
        workdir_id: { type: [string, 'null'], format: uuid }
        workdir_ref: { type: [string, 'null'], description: 카드 표시용(브랜치명 등). 다른 에이전트의 워크트리 경로는 노출하지 않는다. }
        delegated_from_task_id: { type: [string, 'null'], format: uuid, description: 합류 그룹 키. null이면 Director가 직접 만든 lane. }
        has_runtime_session: { type: boolean, description: '`runtime_session_ref` 보유 여부(resume 가능 신호). ref 자체는 노출하지 않는다.' }
        brief: { type: [string, 'null'], description: 위임 요약(첫 트리거 메시지 발췌). }
        status: { $ref: '#/components/schemas/LaneStatus' }
        blocked_note: { type: [string, 'null'] }
        blocked_message_id: { type: [string, 'null'], format: uuid }
        waiting_for: { type: [string, 'null'], description: "blocked면 위임자 이름 또는 Director, waiting_human이면 HITL 요약." }
        hitl_request_id: { type: [string, 'null'], format: uuid, description: waiting_human일 때. }
        paused_over_usd: { type: [number, 'null'], description: paused(budget)일 때 초과 금액. }
        failure_kind: { oneOf: [{ $ref: '#/components/schemas/FailureKind' }, { type: 'null' }] }
        reentry_count: { type: integer }
        current_task: { $ref: '#/components/schemas/Task' }
        current_activity: { type: [string, 'null'], description: running 카드 "현재 동작 한 줄"(마지막 task_event 문장). }
        queue_position: { type: [integer, 'null'], description: queued일 때 대기 순번. }
        join_group:
          type: object
          description: 합류 그룹 상태(FR-6.5).
          properties:
            fired: { type: boolean }
            sibling_count: { type: integer }
            finished_count: { type: integer }
        actions:
          type: array
          description: 호출자가 지금 할 수 있는 동작(director·deputy만 restart/cancel).
          items: { type: string, enum: [restart, cancel, respond_hitl, open_question, approve_budget] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    TaskUsage:
      type: object
      required: [input_tokens, output_tokens, cache_read, cost_usd, estimated]
      properties:
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read: { type: integer, format: int64 }
        cost_usd: { type: number }
        estimated: { type: boolean }
        updated_at: { type: string, format: date-time }

    TaskAttempt:
      type: object
      description: task 이력 표의 "재시도" 행(같은 task, attempt 증가).
      required: [attempt, started_at, finished_at, resumed]
      properties:
        attempt: { type: integer, minimum: 1 }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        resumed: { type: [boolean, 'null'], description: 런타임 세션 resume 성공(true) · 콜드 스타트(false) · 미시작(null). }
        outcome: { type: [string, 'null'], description: 이 시도가 끝난 사유(status 또는 failure_kind). }
        cost_usd: { type: [number, 'null'] }

    Task:
      type: object
      required: [id, lane_id, session_id, runtime_id, agent_id, profile_id, trigger_message_id, delegated_from_task_id, restarted_from_task_id, originator_user_id, coalesced_message_ids, attempt, max_attempts, pending_hitl, budget_override, status, paused_reason, failure_kind, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        lane_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        runtime_id: { type: [string, 'null'], format: uuid }
        agent_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        trigger_message_id: { type: [string, 'null'], format: uuid }
        delegated_from_task_id: { type: [string, 'null'], format: uuid }
        restarted_from_task_id: { type: [string, 'null'], format: uuid, description: 재지시(FR-3.4 B). }
        originator_user_id: { type: [string, 'null'], format: uuid, description: 체인 최상단 사람(권한 판정 기준). }
        coalesced_message_ids: { type: array, items: { type: string, format: uuid } }
        attempt: { type: integer }
        max_attempts: { type: integer }
        pending_hitl: { type: boolean }
        budget_override: { type: [number, 'null'], description: USD. HITL 예산 승인값(C2′). }
        status: { $ref: '#/components/schemas/TaskStatus' }
        paused_reason: { oneOf: [{ $ref: '#/components/schemas/PauseReason' }, { type: 'null' }] }
        failure_kind: { oneOf: [{ $ref: '#/components/schemas/FailureKind' }, { type: 'null' }] }
        transport: { type: [string, 'null'], enum: [acp, cli, null], description: 실제 사용 경로(활동 피드에도 기록). }
        resumed: { type: [boolean, 'null'], description: 현재 attempt가 resume이었는지. 콜드 스타트는 눈에 띄게 표시(SCREEN §4.5). }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/TaskAttempt' }
        usage: { $ref: '#/components/schemas/TaskUsage' }
        open_hitl_request_id: { type: [string, 'null'], format: uuid }
        heartbeat_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        dispatched_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    TaskEvent:
      type: object
      description: '`task_event` 행. `class` 집합과 `object_ref` 형식은 `contracts/task_event.schema.json`이 정한다 — 여기서는 열어 둔다.'
      required: [id, task_id, seq, class, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1, description: 'task attempt. (task_id, attempt, seq)가 멱등키 — daemon-protocol §4.2 (v0.4)' }
        seq: { type: integer, minimum: 0 }
        class: { type: string }
        verb: { type: [string, 'null'] }
        object_ref: { type: [string, 'null'], maxLength: 512, description: 'task_event.schema.json과 같은 문자열(파일 경로·명령 첫 토큰·툴 제목 등). v0.4에서 object → string으로 정렬(PR #22 리뷰 N2).' }
        outcome: { type: [string, 'null'] }
        payload: { type: [object, 'null'], additionalProperties: true, description: 'task_event.schema.json $defs 중 class에 맞는 payload를 **최상위로** 그대로. 활동 피드가 tool_call_id로 툴 호출을 접는 근거(v0.4, PR #22 리뷰 R2). usage 안에 중첩하지 않는다.' }
        tool: { type: [string, 'null'] }
        input: { type: [object, 'null'], additionalProperties: true }
        output: { type: [object, 'null'], additionalProperties: true }
        usage: { type: [object, 'null'], additionalProperties: true }
        superseded_by: { type: [string, 'null'], format: uuid }
        masked: { type: boolean, description: 워크스페이스 마스킹으로 input·output이 요약으로 대체됨. }
        sentence: { type: [string, 'null'], description: '서버가 만든 한 문장 렌더("에이전트가 [동사]를 [목적어]에 했다 → [결과]"). 렌더러 폴백용.' }
        created_at: { type: string, format: date-time }

    # ── HITL ──
    HitlRequest:
      type: object
      required: [id, session_id, task_id, source, type, question, options, proposed_default, approver_spec, due_at, overdue, status, approved, answer, answered_by, answered_at, created_at, can_respond]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        task_id: { type: [string, 'null'], format: uuid, description: system 발행이면 null — 단 예산 초과 HITL은 채운다(s-13). }
        lane_id: { type: [string, 'null'], format: uuid }
        agent:
          type: object
          description: 요청한 에이전트(source=agent).
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        source: { $ref: '#/components/schemas/HitlSource' }
        type: { $ref: '#/components/schemas/HitlType' }
        question: { type: string }
        context: { type: [string, 'null'], description: '`--context` / `--why` / approval의 summary.' }
        options: { type: array, items: { type: string } }
        proposed_default: { type: [string, 'null'], description: '"에이전트 제안: …"으로 함께 표시.' }
        artifact_id: { type: [string, 'null'], format: uuid, description: approval 대상 아티팩트. }
        purpose:
          type: [string, 'null']
          enum: [agent, user_approval, budget, time, loop, null]
          description: "HITL 의 용도. **플랫폼 발행이면 용도별 고정값** — 종료 조건 승인 `user_approval`(E6-01) · 예산 `budget`(E9-01·04) · 시간 `time` · 루프 `loop`(E4-03); 에이전트 발행(source=agent)은 `agent`. source=system + type=approval 만으로는 완료 승인과 예산·루프 정지를 구분할 수 없어 이 칸이 판정 기준이다(0012, PR #103·#108)."
        approver_spec: { type: string, description: '`director` · `any_member` · 사용자 uuid.' }
        due_at: { type: string, format: date-time }
        overdue: { type: boolean }
        status: { $ref: '#/components/schemas/HitlStatus' }
        approved: { type: [boolean, 'null'] }
        answer: { type: [string, 'null'] }
        answered_by: { type: [string, 'null'], format: uuid }
        answered_at: { type: [string, 'null'], format: date-time }
        budget_override_usd: { type: [number, 'null'], description: 예산 승인으로 기록된 상향값. }
        can_respond: { type: boolean, description: 호출자가 지금 응답할 수 있는가. }
        can_respond_from: { type: [string, 'null'], format: date-time, description: deputy가 응답 가능해지는 시각(기한 절반). }
        message_id: { type: [string, 'null'], format: uuid, description: 타임라인의 hitl 카드. }
        created_at: { type: string, format: date-time }

    HitlCreate:
      description: 타입별 본문(FR-5.1 표).
      oneOf:
        - $ref: '#/components/schemas/HitlCreateQuestion'
        - $ref: '#/components/schemas/HitlCreateChoice'
        - $ref: '#/components/schemas/HitlCreateApproval'
        - $ref: '#/components/schemas/HitlCreateInfo'
      discriminator:
        propertyName: type
        mapping:
          question: '#/components/schemas/HitlCreateQuestion'
          choice: '#/components/schemas/HitlCreateChoice'
          approval: '#/components/schemas/HitlCreateApproval'
          info: '#/components/schemas/HitlCreateInfo'

    HitlCreateBase:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/HitlType' }
        approver_spec:
          type: string
          default: director
          description: '`director` · `any_member` · 사용자 uuid. 그 밖은 422(fail closed).'
        due_in:
          type: string
          default: PT24H
          description: ISO 8601 duration.

    HitlCreateQuestion:
      allOf:
        - $ref: '#/components/schemas/HitlCreateBase'
        - type: object
          required: [question, proposed_default]
          properties:
            question: { type: string, minLength: 1 }
            context: { type: string }
            proposed_default: { type: string, minLength: 1 }

    HitlCreateChoice:
      allOf:
        - $ref: '#/components/schemas/HitlCreateBase'
        - type: object
          required: [question, options, proposed_default]
          properties:
            question: { type: string, minLength: 1 }
            context: { type: string }
            options: { type: array, minItems: 2, items: { type: string } }
            proposed_default: { type: string, minLength: 1, description: options 중 하나. }

    HitlCreateApproval:
      allOf:
        - $ref: '#/components/schemas/HitlCreateBase'
        - type: object
          required: [summary]
          properties:
            summary: { type: string, minLength: 1, description: '`--summary`. `question` 필드로 저장된다.' }
            artifact_id: { type: string, format: uuid, description: '`--artifact`.' }

    HitlCreateInfo:
      allOf:
        - $ref: '#/components/schemas/HitlCreateBase'
        - type: object
          required: [what]
          properties:
            what: { type: string, minLength: 1, description: '`--what`. `question` 필드로 저장된다.' }
            why: { type: string, description: '`--why`.' }

    HitlResponse:
      type: object
      description: 타입에 맞는 필드만 쓴다 — question/choice는 `answer`, approval은 `approved`(+ `reason`, 예산이면 `budget_override_usd`, 시간이면 `time_extension`), info는 `answer` + `attachments`.
      properties:
        answer: { type: string }
        approved: { type: boolean }
        reason: { type: string, description: 거절 사유(결정 기록에 저장). }
        budget_override_usd: { type: number, minimum: 0, description: 예산 초과 HITL 승인 시 새 task 상한(→ `task.budget_override`). }
        time_extension: { type: string, description: 시간 초과 HITL 승인 시 연장(ISO 8601 duration). }
        attachments:
          type: array
          description: info 응답 첨부(아티팩트 id 또는 URL).
          items:
            type: object
            properties:
              artifact_id: { type: string, format: uuid }
              url: { type: string, format: uri }

    # ── 아티팩트 · 결정 ──
    Artifact:
      type: object
      required: [id, session_id, name, version, type, storage_ref, submitted_by_task_id, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        type: { type: string }
        storage_ref: { type: string }
        size_bytes: { type: integer, format: int64 }
        content_type: { type: [string, 'null'] }
        submitted_by_task_id: { type: [string, 'null'], format: uuid }
        submitted_by:
          type: object
          properties:
            agent_id: { type: string, format: uuid }
            agent_name: { type: string }
            user_id: { type: string, format: uuid }
        description: { type: [string, 'null'] }
        latest: { type: boolean, description: 같은 이름 중 최신 버전. }
        review: { $ref: '#/components/schemas/ArtifactReview' }
        created_at: { type: string, format: date-time }

    ArtifactReview:
      type: object
      required: [artifact_id, verdict, reviewer_agent_id, reviewed_at]
      properties:
        artifact_id: { type: string, format: uuid }
        verdict: { type: string, enum: [approve, reject] }
        comments: { type: [string, 'null'] }
        reviewer_agent_id: { type: string, format: uuid }
        reviewer_task_id: { type: string, format: uuid }
        decision_id: { type: string, format: uuid }
        reviewed_at: { type: string, format: date-time }

    Decision:
      type: object
      required: [id, session_id, summary, rationale, source, ref_id, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        summary: { type: string }
        rationale: { type: [string, 'null'] }
        source: { $ref: '#/components/schemas/DecisionSource' }
        ref_id: { type: [string, 'null'], format: uuid, description: hitl_request.id 또는 task.id. }
        auto: { type: boolean, description: '`auto_answered`(기한 만료로 proposed_default 진행)에서 나온 결정(E7-12 "자동" 표시).' }
        created_at: { type: string, format: date-time }

    # ── 인박스 ──
    InboxItem:
      type: object
      required: [id, workspace_id, type, severity, session_id, ref_id, read_at, created_at, actions]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/InboxItemType' }
        severity: { $ref: '#/components/schemas/InboxSeverity' }
        session_id: { type: [string, 'null'], format: uuid }
        session: { $ref: '#/components/schemas/SessionRef' }
        ref_id: { type: [string, 'null'], format: uuid, description: 타입별 — hitl_request · message · task · runtime id. }
        due_at: { type: [string, 'null'], format: date-time, description: hitl_request면 기한(정렬 키). }
        overdue: { type: boolean }
        delegated: { type: boolean, description: 'deputy에게 위임되어 나타난 항목 — "위임됨 · 지금부터 응답 가능"(O5).' }
        card:
          type: object
          description: 타입별 카드 내용(SCREEN §4.6 표). 세션을 열지 않고 처리할 수 있게 충분히 담는다.
          properties:
            title: { type: string }
            body: { type: string }
            agent_name: { type: [string, 'null'] }
            proposed_default: { type: [string, 'null'] }
            hitl_type: { $ref: '#/components/schemas/HitlType' }
            paused_reason: { $ref: '#/components/schemas/PauseReason' }
            purpose: { type: [string, 'null'], enum: [agent, user_approval, budget, time, loop, null], description: "HITL 항목이면 `HitlRequest.purpose` 를 그대로 싣는다(K-9) — 웹이 task 범위 예산 HITL(세션은 active)에 상향 입력을 붙이려면 카드에서 바로 읽어야 한다. 비-HITL 항목은 null." }
            failure_kind: { $ref: '#/components/schemas/FailureKind' }
            runtime_name: { type: [string, 'null'] }
            grace_ends_at: { type: [string, 'null'], format: date-time }
            message_id: { type: [string, 'null'], format: uuid }
            lane_id: { type: [string, 'null'], format: uuid }
            summary: { type: [string, 'null'], description: session_completed 결과 요약. }
        actions:
          type: array
          description: 인라인 동작(타입·권한별).
          items: { type: string, enum: [answer, approve, reject, reply, approve_continue, restart, rebind, open_session, open_runtimes] }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    InboxSummary:
      type: object
      required: [action_required, overdue]
      properties:
        action_required: { type: integer, description: 내비 뱃지 값. }
        overdue: { type: integer }
        unread: { type: integer }

    # ── 비용 ──
    CostReport:
      type: object
      required: [total_usd, estimated, input_tokens, output_tokens, cache_read]
      properties:
        total_usd: { type: number }
        budget_usd: { type: [number, 'null'] }
        estimated: { type: boolean, description: 추정치가 섞여 있음 — "추정" 배지(FR-7.3). }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read: { type: integer, format: int64 }
        by_agent:
          type: array
          items: { $ref: '#/components/schemas/CostBucket' }
        by_task:
          type: array
          items: { $ref: '#/components/schemas/CostBucket' }
        by_runtime:
          type: array
          items: { $ref: '#/components/schemas/CostBucket' }
        by_session:
          type: array
          items: { $ref: '#/components/schemas/CostBucket' }
        test_chat_usd: { type: number, description: 워크스페이스 집계에서 테스트 채팅 비용(세션 아님). }
        from: { type: [string, 'null'], format: date-time }
        to: { type: [string, 'null'], format: date-time }

    CostBucket:
      type: object
      required: [id, name, cost_usd, estimated]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cost_usd: { type: number }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read: { type: integer, format: int64 }
        estimated: { type: boolean }
        budget_usd: { type: [number, 'null'] }
        task_count: { type: integer }

    # ── 실시간 ──
    StreamEvent:
      type: object
      description: |
        SSE `data` 프레임. `id`는 프레임 헤더와 같은 단조 증가 커서. `ephemeral: true`인 종류(`message.delta` · `agent.typing` · `test_chat.delta`)는 영속·백필되지 않는다(PRD §7 고빈도 이벤트).

        | type | payload | 화면 |
        |---|---|---|
        | `resync` | `{reason}` — 보존 창 밖의 `Last-Event-ID`. REST로 다시 읽어라 | 전역 |
        | `session.updated` | `Session`(부분: status · paused_reason · paused_detail · cost_usd · runtime_id · last_activity_at) | S5 · S7 |
        | `session.completion_progress` | `{session_id, completion_progress}` | S7 |
        | `participant.updated` | `Participant`(status · status_note · profile) | S7 |
        | `lane.updated` | `Lane` | S7 |
        | `task.updated` | `Task`(status · attempt · failure_kind · usage) | S7 |
        | `task_event.appended` | `TaskEvent` | S7 활동 피드 |
        | `task_event.superseded` | `{task_id, event_id, superseded_by}` — 제자리 갱신 | S7 |
        | `message.created` | `Message` | S7 |
        | `message.updated` | `Message`(edited · reply_count · state) | S7 |
        | `message.delta` | `{session_id, task_id, agent_id, message_id?, text}` — 토큰 스트리밍(ephemeral) | S7 |
        | `agent.typing` | `{session_id, agent_id, typing}` (ephemeral) | S7 |
        | `hitl.created` · `hitl.updated` | `HitlRequest` | S7 · S8 |
        | `artifact.created` | `Artifact` | S7 |
        | `decision.created` | `Decision` | S7 |
        | `inbox.item_created` · `inbox.item_updated` | `InboxItem`(본인 것만) | S8 |
        | `inbox.summary` | `InboxSummary` | App Nav |
        | `runtime.updated` | `Runtime` | S11 · S6 |
        | `pairing.updated` | `Pairing` | S12 · S4 |
        | `workdir.updated` | `Workdir`(GC 결과 포함) | S13 |
        | `cost.updated` | `{session_id, cost_usd, estimated}` | S5 · S7 |
        | `test_chat.delta` | `{test_chat_id, text}` (ephemeral) | S10 |
        | `test_chat.turn` | `{test_chat_id, turn: TestChatTurn, transport, input_tokens, output_tokens}` | S10 |
      required: [id, type, at, payload]
      properties:
        id: { type: string, description: 커서(= SSE id). }
        type:
          type: string
          enum:
            - resync
            - session.updated
            - session.completion_progress
            - participant.updated
            - lane.updated
            - task.updated
            - task_event.appended
            - task_event.superseded
            - message.created
            - message.updated
            - message.delta
            - agent.typing
            - hitl.created
            - hitl.updated
            - artifact.created
            - decision.created
            - inbox.item_created
            - inbox.item_updated
            - inbox.summary
            - runtime.updated
            - pairing.updated
            - workdir.updated
            - cost.updated
            - test_chat.delta
            - test_chat.turn
        at: { type: string, format: date-time }
        workspace_id: { type: string, format: uuid }
        session_id: { type: [string, 'null'], format: uuid }
        ephemeral: { type: boolean, default: false }
        payload: { type: object, additionalProperties: true }

    # ── CLI ──
    CliContext:
      type: object
      description: '`TaskToken`이 가리키는 범위. CLI는 이 값으로 경로 파라미터를 채운다.'
      required: [task_id, lane_id, session_id, agent_id, workspace_id, attempt, last_seq, expires_at]
      properties:
        task_id: { type: string, format: uuid }
        lane_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        agent_name: { type: string }
        workspace_id: { type: string, format: uuid }
        attempt: { type: integer }
        last_seq: { type: integer, description: '이 task가 지금까지 쓴 **마지막(최댓값)** client seq(attempt 무관) — 개수가 아니다(구멍이 있어도 max). 출처는 idempotency_key.client_seq, 없으면 UUIDv5 순차 대조(ClientSeq 헤더 설명). CLI는 last_seq+1부터 이어 쓴다 — 멱등키 UUIDv5(task:<task_id>:<seq>)가 attempt 경계를 넘어 유일하도록(colab-cli.md §1, E8-04).' }
        delegated_from_task_id: { type: [string, 'null'], format: uuid }
        suppressed_delegator_agent_id: { type: [string, 'null'], format: uuid, description: 규칙 8로 멘션이 억제되는 위임자(합류 발화 전). 질문은 `status set blocked`로. }
        open_hitl_request_id: { type: [string, 'null'], format: uuid, description: 이미 열린 HITL이 있으면 두 번째 `hitl ask`는 409. }
        participants:
          type: array
          description: 위임 가능한 대상(세션 참여자)과 멘션 링크.
          items:
            type: object
            required: [agent_id, name, mention_link]
            properties:
              agent_id: { type: string, format: uuid }
              name: { type: string }
              role: { $ref: '#/components/schemas/AgentRole' }
              mention_link: { type: string }
        expires_at: { type: string, format: date-time }
