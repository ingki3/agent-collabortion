        **세션이 아니다** — `session` 레코드 0개, lane 0개, `COLAB_TASK_TOKEN` 미발급(E15-03). 임시 workdir은 종료 시 삭제. 비용은 워크스페이스에만 합산. 선택한 런타임이 오프라인이면 `409`.
