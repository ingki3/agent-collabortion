      description: |
        권한: Director.
        종료 조건과 무관하게 Director가 직접 끝낸다(FR-2.2 `manual`, E6-08). 진행 중 lane이 있으면 확인용으로 `running_lane_count`를 `409`가 아니라 응답에 실어 주고, `confirm: true`가 없으면 `409 running_lanes`. `completing`에서 요약(P4) 후 `completed`.
