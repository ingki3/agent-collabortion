      description: |
        권한: Director · deputy(**즉시**, t-3). 다른 멤버는 `403`(E10-05).
        **`Idempotency-Key` 필수**(메시지를 게시한다). 진행 중 턴을 §8.2.2 절차로 취소하고(되돌리기 어려운 작업 중이면 최대 30초 보류, E10-01·02) lane 에이전트를 멘션한 새 메시지를 게시해 **새 task**(`attempt` 1, `restarted_from_task_id` = 이전 task)를 만든다. lane은 `running` 유지. 프롬프트는 `<resumed>` 없이 새 지시만(E8-06). `failed(cancelled)`·`failed(timeout)` lane의 "다시 지시"도 이것이다(SCREEN §4.5 실패 분류 표). lane이 `running`·`failed`·`paused`가 아니면 `409`.
      x-prd: [FR-3.4]
      x-screen: [S7, S8]
      x-phase: P3
