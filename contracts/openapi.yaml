  # ───────────────────────────── sessions ─────────────────────────────
  /workspaces/{workspaceId}/sessions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [sessions]
      operationId: listSessions
      summary: 세션 목록(S5)
      description: |
        권한: 워크스페이스 멤버(비공개 세션은 v1에 없다 — FR-5.3).
        행마다 상태 배지(+`paused_reason`), 진행률, 비용/예산, 마지막 활동, 주의 배지(HITL 대기 · blocked · 실패 수).
      x-prd: [FR-2.3]
      x-screen: [S5]
      x-phase: P1
      parameters:
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/SessionStatus' }
        - name: director_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: agent_id
          in: query
          description: 참여 에이전트.
          schema: { type: string, format: uuid }
        - name: runtime_id
          in: query
          schema: { type: string, format: uuid }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: 제목 · goal 검색.
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_activity, cost, created_at]
            default: last_activity
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 페이지.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SessionListItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [sessions]
      operationId: createSession
      summary: 세션 생성(S6 마법사 제출)
      description: |
        권한: 워크스페이스 멤버. 생성자가 기본 Director(`director_user_id` 생략 시). 참여자 각각에 대해 호출자의 `respond_to` 초대 권한을 검사한다(FR-1.9, E10-09·11).
        검증(`422`, `Problem.errors[]`): `isolation.kind`가 `worktree`·`container`면 `runtime_id` 필수(E15-11) · `criteria_met` 단독 불가(E6-07) · `container`는 v1.1(`kind: container` 거부) · `supervised`는 v1.1 · worktree면 저장소 검증(`checkRepo`) 통과 필요 · 참여자 프로파일의 `runtime_kind`가 선택 런타임에 없으면 `warnings[]`(거부 아님). 런타임 0개면 `409 no_runtime`(SCREEN §2.1). 디스크 상한 도달이면 `409 workdir_quota_exceeded`(E13-16).
        생성 직후 상태는 `active`이고 assignee에게 초기 task가 만들어진다(E16-A 1단계). `draft`로 저장하려면 `draft: true`.
      x-prd: [FR-2.1, FR-2.2, FR-1.9, FR-4.4, FR-6.4]
      x-screen: [S6]
      x-phase: P1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreate' }
      responses:
        '201':
          description: 생성됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /workspaces/{workspaceId}/runtime-candidates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [sessions]
      operationId: listRuntimeCandidates
      summary: 런타임 후보(S6 4단계 · S17 재바인딩)
      description: |
        권한: 워크스페이스 멤버.
        격리 방식이 후보를 제한한다 — `none`은 온라인 런타임 전부(자동 선택 허용), `worktree`는 **remote URL이 같은** 저장소를 가진 온라인 런타임만(경로 문자열 비교 아님, FR-9.2 F · E14-04·05). 후보가 아닌 런타임도 `eligible: false` + `reason`으로 돌려준다(화면이 비활성+사유로 그린다).
      x-prd: [FR-2.1, FR-9.2]
      x-screen: [S6, S17]
      x-phase: P2
      parameters:
        - name: isolation
          in: query
          required: true
          schema: { $ref: '#/components/schemas/IsolationKind' }
        - name: remote_url
          in: query
          description: worktree일 때 기준 저장소 remote URL. 세션 재바인딩이면 세션의 저장소.
          schema: { type: string }
        - name: session_id
          in: query
          description: 재바인딩 후보 조회 시 세션 id(격리·저장소를 세션에서 읽는다).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 후보.
          content:
            application/json:
              schema:
                type: object
                required: [auto_select_allowed, candidates]
                properties:
                  auto_select_allowed: { type: boolean, description: '"자동 선택(첫 실행 시 고정)" 허용 여부 — `none`만 true.' }
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/RuntimeCandidate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getSession
      summary: 세션 상세(S7 우열 · 상단)
      description: |
        권한: 워크스페이스 멤버 · `TaskToken`(그 task의 세션만).
        goal · 성공 기준 · 종료 조건 진행률 · 한도 · 비용(추정 배지) · 런타임/격리 · `paused_detail`(사유 5종별 해결 동작 데이터) · 참여자(파생 상태) · 첨부 컨텍스트 · 호출자의 세션 역할(`my_role`).
      x-colab-cli: session get
      x-prd: [FR-2.1, FR-2.3, FR-4.1]
      x-screen: [S7]
      x-phase: P1
      security:
        - UserSession: []
        - TaskToken: []
      responses:
        '200':
          description: 상세.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [sessions]
      operationId: updateSession
      summary: 세션 설정 편집(goal · 성공 기준 · 한도 · autonomy · deputy)
      description: |
        권한: Director.
        **런타임과 격리는 변경 불가**(workdir이 묶여 있다 — SCREEN §4.5 상단 액션). `draft` 상태에서만 `completion_condition`·`isolation`·`runtime_id`도 바꿀 수 있다.
      x-prd: [FR-2.1]
      x-screen: [S7]
      x-phase: P3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionUpdate' }
      responses:
        '200':
          description: 변경됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /sessions/{sessionId}/start:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: startSession
      summary: draft → active
      description: |
        권한: Director.
        `createSession`과 같은 검증을 다시 거친다. assignee 초기 task를 만든다. `draft`가 아니면 `409`.
      x-prd: [FR-2.3]
      x-screen: [S5, S7]
      x-phase: P2
      responses:
        '200':
          description: 시작됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /sessions/{sessionId}/pause:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: pauseSession
      summary: 일시정지(Director · 드레인)
      description: |
        권한: Director.
        `active → paused(director)`. 진행 중 턴은 **마치게 둔다**(드레인) — `turn_end` 후 새 dispatch 없음(E5-06). `queued` task는 재개 때까지 dispatch되지 않는다(C3′). `active`가 아니면 `409`.
      x-prd: [FR-2.3]
      x-screen: [S7]
      x-phase: P3
      responses:
        '200':
          description: 일시정지됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }

  /sessions/{sessionId}/resume:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: resumeSession
      summary: 재개 / "계속 진행 승인"(paused 사유별)
      description: |
        권한: Director. 사유가 `budget`·`time`·`loop`면 **기한 절반 후 deputy**도 가능(SCREEN §4.5 paused 해소 표). `runtime_offline`은 여기서 재개할 수 없다 — `rebindSession` 또는 `cancelSession`(`409`).
        `paused → active`. `queued` task를 큐 순서대로 dispatch한다(E5-05). 사유별 본문:
        - `budget`: `limits.budget_usd`를 새 상한으로(생략 시 현재 소진액 이상이어야 함 — 아니면 `422`).
        - `time`: `limits.time_limit` 연장.
        - `loop`: 카운터를 리셋하고 재개(`reset_loop_counters`, 기본 true). 배너의 "개입해서 방향 바꾸기"는 lane `restart`/`cancel`로 따로 한다.
        - `director`: 본문 없음.
        세션 예산 초과로 발행된 시스템 HITL(`source: system`, `task_id` 없음)이 열려 있으면 이 호출이 그것을 `answered(approved)`로 닫는다.
      x-prd: [FR-2.3, FR-3.5, FR-7.3]
      x-screen: [S7, S8]
      x-phase: P3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limits: { $ref: '#/components/schemas/SessionLimits' }
                reset_loop_counters: { type: boolean, default: true }
      responses:
        '200':
          description: 재개됨.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

