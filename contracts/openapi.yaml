    get:
      tags: [sessions]
      operationId: listParticipants
      summary: 참여 에이전트(S7 좌열 참여자 칩)
      description: |
        권한: 워크스페이스 멤버.
        각 참여자의 **파생 상태**(FR-1.3 순서: disabled > offline > error > working > waiting_human > idle — 이 세션의 런타임·task 기준)와 둘째 줄 텍스트(`status_note`, 예: "lane #2 질문 대기"), 사용 프로파일.
      x-prd: [FR-1.3]
      x-screen: [S7]
      x-phase: P2
      responses:
