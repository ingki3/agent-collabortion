    post:
      tags: [messages]
      operationId: previewTriggers
      summary: 트리거 미리보기(FR-3.6)
      description: |
        권한: 워크스페이스 멤버.
        게시하지 않고 규칙 1~8 + lane 해소 결과를 돌려준다 — "이 메시지는 @Backend를 트리거합니다 · 실행 중이라 큐잉됩니다"(SCREEN §4.5 O4). 동기 경로에 LLM 호출 없음(§8.1). 본문은 `postMessage`와 같다.
      x-prd: [FR-3.6, FR-3.3]
      x-screen: [S7]
      x-phase: P2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '200':
